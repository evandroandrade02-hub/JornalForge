name: Gerar APK JornalForge

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./JornalForge_Android

    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ajustar Manifesto, Dependencias, Titulo (+35% com Margem) e Opcao 57s
        run: |
          python3 -c '
          import re, os

          open("gradle.properties", "w").write("org.gradle.jvmargs=-Xmx4096m\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n")

          m = "app/src/main/AndroidManifest.xml"
          txt = open(m).read()
          txt = txt.replace("FOREGROUND_SERVICE_MEDIA_PROCESSING", "FOREGROUND_SERVICE_DATA_SYNC")
          txt = txt.replace("mediaProcessing", "dataSync")
          open(m, "w").write(txt)

          b = "app/build.gradle.kts"
          lines = [l for l in open(b) if "ffmpeg-kit" not in l]
          open(b, "w").writelines(lines)

          # Ajustar FrameRenderer.kt:
          # 1. Remover qualquer ColorFilter azulado
          # 2. Aumentar o TITULO em +35% (muito mais em evidencia) e textos secundarios em +14%
          # 3. Garantir quebra de linha automatica e recuo seguro para nao invadir o avatar nem sair da tela
          fr_path = "app/src/main/java/com/jornalforge/app/video/FrameRenderer.kt"
          if os.path.exists(fr_path):
              fr = open(fr_path).read()
              fr = re.sub(r"\.colorFilter\s*=\s*[^\n]+", "", fr)

              # Identificar os tamanhos de fonte: o maior textSize (ou associado a title) ganha +35%, os demais ganham +14%
              sizes = [float(x) for x in re.findall(r"textSize\s*=\s*(\d+(?:\.\d+)?)f", fr)]
              max_size = max(sizes) if sizes else 40.0

              def boost_font_smart(match):
                  full_line = match.group(0)
                  prefix = match.group(1)
                  val = float(match.group(2))
                  # Se for a fonte do titulo (maior fonte ou contem title no contexto proximo), aumenta 35%
                  if val >= max_size * 0.85:
                      new_val = round(val * 1.35, 1)
                  else:
                      new_val = round(val * 1.14, 1)
                  return f"{prefix}{new_val}f"

              fr = re.sub(r"(textSize\s*=\s*)(\d+(?:\.\d+)?)f", boost_font_smart, fr)

              # Ajustar limite de caracteres por linha para o titulo grande quebrar certinho dentro da margem segura
              def shrink_line_chars(match):
                  prefix = match.group(1)
                  val = int(match.group(2))
                  if val <= 28:
                      # Linha de titulo: reduz ~26% na contagem de caracteres por linha para compensar os +35% de fonte
                      new_val = max(14, int(val * 0.74))
                  else:
                      # Linha de subtitulo/legenda: reduz ~15%
                      new_val = max(18, int(val * 0.85))
                  return f"{prefix}{new_val}"

              fr = re.sub(r"(maxCharsPerLine\s*=\s*|wrapText\([^,]+,\s*)(\d+)", shrink_line_chars, fr)
              open(fr_path, "w").write(fr)

          # Ajustar ScriptParser.kt para suportar duracao <= 57 segundos (quando durationMinutes == 1)
          sp_path = "app/src/main/java/com/jornalforge/app/model/ScriptParser.kt"
          if os.path.exists(sp_path):
              sp = open(sp_path).read()
              old_fn = "fun buildJournalisticPrompt(theme: String, durationMinutes: Int, sourceBase: String): String {"
              new_fn = """fun buildJournalisticPrompt(theme: String, durationMinutes: Int, sourceBase: String): String {
                  if (durationMinutes == 1) {
                      val basePrompt = buildJournalisticPrompt(theme, 4, sourceBase)
                      return "ATENCAO - MODO VIDEO CURTO (SHORTS/REELS): O video final deve ter NO MAXIMO 57 SEGUNDOS de duracao total (gere entre 3 e 5 cenas curtas, totalizando no maximo 115 a 130 palavras de narracao somadas). Ignore qualquer mencao a 4 minutos abaixo e cumpra rigorosamente o limite de 57 segundos.\\n\\n" + basePrompt
                  }"""
              if old_fn in sp and "MODO VIDEO CURTO" not in sp:
                  sp = sp.replace(old_fn, new_fn, 1)
                  open(sp_path, "w").write(sp)
          '

      - name: Atualizar MainActivity (com opcao 57s e 4 fonemas), Service e Muxer
        run: |
          cat << 'EOF' > app/src/main/java/com/jornalforge/app/MainActivity.kt
          @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)
          package com.jornalforge.app

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.jornalforge.app.audio.PiperTtsEngine
          import com.jornalforge.app.model.ScriptParser
          import com.jornalforge.app.model.VideoAspect
          import com.jornalforge.app.service.ExportStatus
          import com.jornalforge.app.service.VideoExportService
          import java.io.BufferedReader
          import java.io.InputStreamReader

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Color(0xFFD92323),
                              onPrimary = Color.White,
                              background = Color(0xFF0B0E14),
                              surface = Color(0xFF151A24),
                              onSurface = Color(0xFFECEFF4)
                          )
                      ) {
                          JornalForgeScreen()
                      }
                  }
              }
          }

          @Composable
          fun JornalForgeScreen() {
              val context = LocalContext.current
              val scrollState = rememberScrollState()
              val exportStatus by VideoExportService.statusFlow.collectAsState()

              var themeText by remember { mutableStateOf("") }
              var selectedDuration by remember { mutableStateOf(6) }
              var sourceBaseText by remember { mutableStateOf("") }

              var jsonInput by remember { mutableStateOf("") }
              var validationMessage by remember { mutableStateOf("Aguardando colagem ou importação do JSON.") }
              var isJsonValid by remember { mutableStateOf(false) }

              var selectedAspect by remember { mutableStateOf(VideoAspect.HORIZONTAL_16_9) }
              var rmsThreshold by remember { mutableStateOf(520f) }

              val filePickerLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.OpenDocument()
              ) { uri: Uri? ->
                  uri?.let {
                      try {
                          context.contentResolver.openInputStream(it)?.use { stream ->
                              val content = BufferedReader(InputStreamReader(stream)).readText()
                              jsonInput = content
                              val res = ScriptParser.validateAndNormalize(content)
                              res.onSuccess { script ->
                                  isJsonValid = true
                                  validationMessage = "JSON Válido! Título: '${script.videoTitle}' | ${script.scenes.size} cenas normalizadas."
                              }.onFailure { err ->
                                  isJsonValid = false
                                  validationMessage = "Erro: ${err.localizedMessage}"
                              }
                          }
                      } catch (e: Exception) {
                          validationMessage = "Erro ao ler arquivo: ${e.localizedMessage}"
                      }
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0B0E14))
                      .verticalScroll(scrollState)
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Box(
                          modifier = Modifier
                              .width(6.dp)
                              .height(34.dp)
                              .background(Color(0xFFD92323))
                      )
                      Spacer(modifier = Modifier.width(10.dp))
                      Column {
                          Text(
                              text = "JORNALFORGE ANDROID",
                              color = Color.White,
                              fontSize = 22.sp,
                              fontWeight = FontWeight.ExtraBold
                          )
                          Text(
                              text = "Gerador Jornalístico • Voz Faber PT-BR • Exportação MP4 Única",
                              color = Color(0xFF9AA5B8),
                              fontSize = 12.sp
                          )
                      }
                  }

                  StepCard(title = "ETAPA 1 • Fonte e Configuração") {
                      OutlinedTextField(
                          value = themeText,
                          onValueChange = { themeText = it },
                          label = { Text("Tema (Ex: O verdadeiro interesse por trás de uma decisão)") },
                          modifier = Modifier.fillMaxWidth(),
                          singleLine = true
                      )

                      Spacer(modifier = Modifier.height(8.dp))
                      Text("Duração aproximada:", color = Color(0xFFB8C2D4), fontSize = 13.sp)
                      Row(
                          horizontalArrangement = Arrangement.spacedBy(6.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          listOf(1, 4, 6, 8, 10).forEach { min ->
                              val labelText = if (min == 1) "≤ 57s" else "$min min"
                              FilterChip(
                                  selected = selectedDuration == min,
                                  onClick = { selectedDuration = min },
                                  label = { Text(labelText, fontSize = 12.sp) }
                              )
                          }
                      }

                      OutlinedTextField(
                          value = sourceBaseText,
                          onValueChange = { sourceBaseText = it },
                          label = { Text("Fonte-base (Artigo, transcrição, resumo ou contexto)") },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(130.dp)
                      )

                      if (sourceBaseText.trim().startsWith("http://") || sourceBaseText.trim().startsWith("https://")) {
                          Text(
                              text = "⚠️ Você colou um link. Para máxima fidelidade jornalística, forneça também a transcrição ou resumo do conteúdo-base.",
                              color = Color(0xFFFFB74D),
                              fontSize = 12.sp,
                              modifier = Modifier.padding(top = 4.dp)
                          )
                      }

                      Spacer(modifier = Modifier.height(8.dp))
                      Button(
                          onClick = {
                              if (themeText.isBlank() || sourceBaseText.isBlank()) {
                                  Toast.makeText(context, "Preencha o tema e a fonte-base.", Toast.LENGTH_SHORT).show()
                              } else {
                                  val prompt = ScriptParser.buildJournalisticPrompt(themeText, selectedDuration, sourceBaseText)
                                  val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                  clipboard.setPrimaryClip(ClipData.newPlainText("Prompt JornalForge", prompt))
                                  Toast.makeText(context, "Prompt jornalístico gerado e copiado!", Toast.LENGTH_LONG).show()
                              }
                          },
                          modifier = Modifier.fillMaxWidth(),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD92323))
                      ) {
                          Text("Gerar e copiar prompt", fontWeight = FontWeight.Bold)
                      }
                  }

                  StepCard(title = "ETAPA 2 • Importação e Validação do JSON") {
                      OutlinedTextField(
                          value = jsonInput,
                          onValueChange = {
                              jsonInput = it
                              isJsonValid = false
                          },
                          label = { Text("Cole aqui o roteiro JSON retornado pela IA") },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(150.dp)
                      )

                      Spacer(modifier = Modifier.height(8.dp))
                      Row(
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          OutlinedButton(
                              onClick = {
                                  val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                  val clipText = clipboard.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                                  if (clipText.isNotEmpty()) {
                                      jsonInput = clipText
                                  }
                              },
                              modifier = Modifier.weight(1f)
                          ) {
                              Text("Colar Área Transf.", fontSize = 12.sp)
                          }

                          OutlinedButton(
                              onClick = {
                                  filePickerLauncher.launch(arrayOf("application/json", "text/plain"))
                              },
                              modifier = Modifier.weight(1f)
                          ) {
                              Text("Importar .json/.txt", fontSize = 12.sp)
                          }
                      }

                      Spacer(modifier = Modifier.height(8.dp))
                      Button(
                          onClick = {
                              val result = ScriptParser.validateAndNormalize(jsonInput)
                              result.onSuccess { script ->
                                  isJsonValid = true
                                  validationMessage = "✅ Estrutura válida! Título: \"${script.videoTitle}\" | ${script.scenes.size} cenas prontas."
                              }.onFailure { err ->
                                  isJsonValid = false
                                  validationMessage = "❌ ${err.localizedMessage}"
                              }
                          },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Validar estrutura", fontWeight = FontWeight.Bold)
                      }

                      Spacer(modifier = Modifier.height(6.dp))
                      Text(
                          text = validationMessage,
                          color = if (isJsonValid) Color(0xFF66BB6A) else Color(0xFFFFCA28),
                          fontSize = 13.sp
                      )
                  }

                  StepCard(title = "ETAPA 3 • Formato e Geração de Vídeo Único") {
                      VideoAspect.values().forEach { aspect ->
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              RadioButton(
                                  selected = selectedAspect == aspect,
                                  onClick = { selectedAspect = aspect }
                              )
                              Text(text = aspect.label, color = Color.White, fontSize = 14.sp)
                          }
                      }

                      Spacer(modifier = Modifier.height(8.dp))
                      Row(
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Button(
                              onClick = {
                                  val validation = ScriptParser.validateAndNormalize(jsonInput)
                                  if (validation.isFailure) {
                                      validationMessage = "❌ Valide um JSON correto antes de gerar: ${validation.exceptionOrNull()?.localizedMessage}"
                                      return@Button
                                  }
                                  val intent = Intent(context, VideoExportService::class.java).apply {
                                      action = VideoExportService.ACTION_START
                                      putExtra(VideoExportService.EXTRA_JSON, jsonInput)
                                      putExtra(VideoExportService.EXTRA_ASPECT, selectedAspect.name)
                                      putExtra(VideoExportService.EXTRA_RMS_THRESHOLD, rmsThreshold.toDouble())
                                      putExtra(VideoExportService.EXTRA_QUICK_TEST, false)
                                  }
                                  context.startForegroundService(intent)
                              },
                              modifier = Modifier.weight(1f),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD92323))
                          ) {
                              Text("Gerar vídeo MP4", fontWeight = FontWeight.Bold)
                          }

                          OutlinedButton(
                              onClick = {
                                  val intent = Intent(context, VideoExportService::class.java).apply {
                                      action = VideoExportService.ACTION_START
                                      putExtra(VideoExportService.EXTRA_ASPECT, selectedAspect.name)
                                      putExtra(VideoExportService.EXTRA_RMS_THRESHOLD, rmsThreshold.toDouble())
                                      putExtra(VideoExportService.EXTRA_QUICK_TEST, true)
                                  }
                                  context.startForegroundService(intent)
                              }
                          ) {
                              Text("Modo Teste (10s)", fontSize = 12.sp)
                          }
                      }

                      when (val st = exportStatus) {
                          is ExportStatus.Running -> {
                              Spacer(modifier = Modifier.height(12.dp))
                              LinearProgressIndicator(
                                  progress = st.progressPercent / 100f,
                                  modifier = Modifier.fillMaxWidth(),
                                  color = Color(0xFFD92323)
                              )
                              Spacer(modifier = Modifier.height(6.dp))
                              Text("Fase atual: ${st.phase} (${st.progressPercent}%)", color = Color.White, fontSize = 13.sp)
                              TextButton(
                                  onClick = {
                                      val cancelIntent = Intent(context, VideoExportService::class.java).apply {
                                          action = VideoExportService.ACTION_CANCEL
                                      }
                                      context.startService(cancelIntent)
                                  }
                              ) {
                                  Text("Cancelar Exportação", color = Color(0xFFEF5350))
                              }
                          }
                          is ExportStatus.Completed -> {
                              Spacer(modifier = Modifier.height(12.dp))
                              Text("✅ Vídeo finalizado e salvo na Galeria (${st.displayPath})!", color = Color(0xFF66BB6A), fontWeight = FontWeight.Bold)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(onClick = {
                                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                                          type = "video/mp4"
                                          putExtra(Intent.EXTRA_STREAM, st.galleryUri)
                                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      }
                                      context.startActivity(Intent.createChooser(shareIntent, "Compartilhar Reportagem MP4"))
                                  }) {
                                      Text("Compartilhar MP4")
                                  }
                                  OutlinedButton(onClick = {
                                      val viewIntent = Intent(Intent.ACTION_VIEW).apply {
                                          setDataAndType(st.galleryUri, "video/mp4")
                                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      }
                                      context.startActivity(viewIntent)
                                  }) {
                                      Text("Abrir Vídeo")
                                  }
                              }
                          }
                          is ExportStatus.Failed -> {
                              Spacer(modifier = Modifier.height(12.dp))
                              Text("❌ Erro em [${st.exactPhase}]: ${st.details}", color = Color(0xFFEF5350), fontSize = 13.sp)
                          }
                          ExportStatus.Idle -> {}
                      }
                  }

                  StepCard(title = "ETAPA 4 • Voz Faber e Avatar Low-Poly N64") {
                      val offlineReady = remember { PiperTtsEngine(context).isOfflineFaberModelInstalled() }
                      Text("• Voz Faber - Português Brasileiro (pt_BR-faber-medium.onnx)", color = Color.White, fontSize = 13.sp)
                      Text("• Motor Piper integrado | Velocidade 0.95 (Fala pausada e eloquente)", color = Color(0xFFB8C2D4), fontSize = 13.sp)
                      Text(
                          text = if (offlineReady) "• Status da Síntese: 100% Offline no Dispositivo (ONNX NDK)"
                                 else "• Status da Síntese: Arquitetura Híbrida Ativa",
                          color = Color(0xFF81C784),
                          fontSize = 12.sp
                      )
                      Text("• Estilo Visual: Low-Poly 3D Fiel ao Modelo (4 Expressões A, E, I, O)", color = Color(0xFFB8C2D4), fontSize = 13.sp)

                      Spacer(modifier = Modifier.height(8.dp))
                      Text("Limiar RMS de Pausa Vocal: ${rmsThreshold.toInt()} (Padrão: 520 PCM 16-bit)", color = Color.White, fontSize = 12.sp)
                      Slider(
                          value = rmsThreshold,
                          onValueChange = { rmsThreshold = it },
                          valueRange = 200f..1200f
                      )

                      Row(
                          horizontalArrangement = Arrangement.SpaceEvenly,
                          modifier = Modifier.fillMaxWidth().padding(top = 8.dp)
                      ) {
                          AvatarPreviewItem(R.drawable.reporter_a, "Fonema A")
                          AvatarPreviewItem(R.drawable.reporter_open, "Fonema E")
                          AvatarPreviewItem(R.drawable.reporter_closed, "Fonema I")
                          AvatarPreviewItem(R.drawable.reporter_o, "Fonema O")
                      }
                  }
              }
          }

          @Composable
          fun StepCard(title: String, content: @Composable ColumnScope.() -> Unit) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(Color(0xFF151A24), RoundedCornerShape(10.dp))
                      .border(1.dp, Color(0xFF263042), RoundedCornerShape(10.dp))
                      .padding(14.dp)
              ) {
                  Text(
                      text = title,
                      color = Color(0xFFD92323),
                      fontWeight = FontWeight.Bold,
                      fontSize = 14.sp
                  )
                  Spacer(modifier = Modifier.height(10.dp))
                  content()
              }
          }

          @Composable
          fun AvatarPreviewItem(resId: Int, label: String) {
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Image(
                      painter = painterResource(id = resId),
                      contentDescription = label,
                      modifier = Modifier
                          .size(72.dp)
                          .border(1.dp, Color(0xFF37474F), RoundedCornerShape(6.dp))
                  )
                  Spacer(modifier = Modifier.height(4.dp))
                  Text(label, color = Color(0xFFB0BEC5), fontSize = 11.sp)
              }
          }
          EOF

          echo "" | base64 -d > app/src/main/java/com/jornalforge/app/service/VideoExportService.kt

          cat << 'EOF' > app/src/main/java/com/jornalforge/app/video/SimpleMp4Muxer.kt
          package com.jornalforge.app.video

          import android.graphics.BitmapFactory
          import android.media.*
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          object SimpleMp4Muxer {

              fun concatenateWavs(wavFiles: List<File>, outWav: File) {
                  if (wavFiles.isEmpty()) return
                  val firstHeader = ByteArray(44)
                  FileInputStream(wavFiles.first()).use { it.read(firstHeader) }

                  var totalDataLen = 0L
                  for (f in wavFiles) {
                      if (f.exists() && f.length() > 44) {
                          totalDataLen += (f.length() - 44)
                      }
                  }

                  val headerBuf = ByteBuffer.wrap(firstHeader).order(ByteOrder.LITTLE_ENDIAN)
                  headerBuf.putInt(4, (36 + totalDataLen).toInt())
                  headerBuf.putInt(40, totalDataLen.toInt())

                  FileOutputStream(outWav).use { fos ->
                      fos.write(firstHeader)
                      val buf = ByteArray(16384)
                      for (wav in wavFiles) {
                          if (!wav.exists() || wav.length() <= 44) continue
                          FileInputStream(wav).use { fis ->
                              fis.skip(44)
                              var read: Int
                              while (fis.read(buf).also { read = it } != -1) {
                                  fos.write(buf, 0, read)
                              }
                          }
                      }
                  }
              }

              fun mux(framesDir: File, wavFile: File, outputMp4: File, width: Int, height: Int) {
                  val frames = framesDir.listFiles()?.filter { it.name.endsWith(".jpg") }?.sortedBy { it.name } ?: return
                  if (frames.isEmpty()) return

                  var sampleRate = 22050
                  var channels = 1
                  if (wavFile.exists() && wavFile.length() > 44) {
                      val header = ByteArray(44)
                      FileInputStream(wavFile).use { it.read(header) }
                      val hb = ByteBuffer.wrap(header).order(ByteOrder.LITTLE_ENDIAN)
                      channels = hb.getShort(22).toInt().coerceIn(1, 2)
                      sampleRate = hb.getInt(24).coerceIn(8000, 48000)
                  }

                  val muxer = MediaMuxer(outputMp4.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)

                  val videoFormat = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, width, height).apply {
                      setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible)
                      setInteger(MediaFormat.KEY_BIT_RATE, 2_500_000)
                      setInteger(MediaFormat.KEY_FRAME_RATE, 4)
                      setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                  }
                  val videoEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                  videoEncoder.configure(videoFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  videoEncoder.start()

                  val channelMask = if (channels == 2) AudioFormat.CHANNEL_IN_STEREO else AudioFormat.CHANNEL_IN_MONO
                  val audioFormat = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, sampleRate, channels).apply {
                      setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)
                      setInteger(MediaFormat.KEY_BIT_RATE, 192_000)
                      setInteger(MediaFormat.KEY_CHANNEL_MASK, channelMask)
                      setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384)
                  }
                  val audioEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC)
                  audioEncoder.configure(audioFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  audioEncoder.start()

                  class EncodedPacket(val data: ByteArray, val ptsUs: Long, val flags: Int)
                  val videoPackets = mutableListOf<EncodedPacket>()
                  val audioPackets = mutableListOf<EncodedPacket>()

                  var outVideoFormat: MediaFormat? = null
                  var outAudioFormat: MediaFormat? = null
                  val vInfo = MediaCodec.BufferInfo()
                  val aInfo = MediaCodec.BufferInfo()

                  for ((i, f) in frames.withIndex()) {
                      val bmp = BitmapFactory.decodeFile(f.absolutePath) ?: continue
                      val inIdx = videoEncoder.dequeueInputBuffer(10_000)
                      if (inIdx >= 0) {
                          val img = videoEncoder.getInputImage(inIdx)
                          if (img != null) {
                              fillYuv420ImageFromBitmap(img, bmp, width, height)
                              videoEncoder.queueInputBuffer(inIdx, 0, width * height * 3 / 2, i * 250_000L, 0)
                          } else {
                              val yuv = bitmapToNv12(bmp, width, height)
                              val buf = videoEncoder.getInputBuffer(inIdx)!!
                              buf.clear()
                              buf.put(yuv)
                              videoEncoder.queueInputBuffer(inIdx, 0, yuv.size, i * 250_000L, 0)
                          }
                      }
                      bmp.recycle()

                      while (true) {
                          val outIdx = videoEncoder.dequeueOutputBuffer(vInfo, 10_000)
                          if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              outVideoFormat = videoEncoder.outputFormat
                          } else if (outIdx >= 0) {
                              val outBuf = videoEncoder.getOutputBuffer(outIdx)!!
                              if ((vInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && vInfo.size > 0) {
                                  val bytes = ByteArray(vInfo.size)
                                  outBuf.position(vInfo.offset)
                                  outBuf.limit(vInfo.offset + vInfo.size)
                                  outBuf.get(bytes)
                                  videoPackets.add(EncodedPacket(bytes, vInfo.presentationTimeUs, vInfo.flags))
                              }
                              videoEncoder.releaseOutputBuffer(outIdx, false)
                          } else break
                      }
                  }

                  val vEos = videoEncoder.dequeueInputBuffer(10_000)
                  if (vEos >= 0) {
                      videoEncoder.queueInputBuffer(vEos, 0, 0, frames.size * 250_000L, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                  }
                  while (true) {
                      val outIdx = videoEncoder.dequeueOutputBuffer(vInfo, 10_000)
                      if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          outVideoFormat = videoEncoder.outputFormat
                      } else if (outIdx >= 0) {
                          val outBuf = videoEncoder.getOutputBuffer(outIdx)!!
                          if ((vInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && vInfo.size > 0) {
                              val bytes = ByteArray(vInfo.size)
                              outBuf.position(vInfo.offset)
                              outBuf.limit(vInfo.offset + vInfo.size)
                              outBuf.get(bytes)
                              videoPackets.add(EncodedPacket(bytes, vInfo.presentationTimeUs, vInfo.flags))
                          }
                          videoEncoder.releaseOutputBuffer(outIdx, false)
                          if ((vInfo.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
                      } else break
                  }
                  videoEncoder.stop()
                  videoEncoder.release()

                  if (wavFile.exists() && wavFile.length() > 44) {
                      val bytesPerSecond = (sampleRate * channels * 2).toDouble()
                      FileInputStream(wavFile).use { fis ->
                          fis.skip(44)
                          val readBuf = ByteArray(4096)
                          var totalReadBytes = 0L
                          var audioInputDone = false

                          while (!audioInputDone) {
                              val inIdx = audioEncoder.dequeueInputBuffer(10_000)
                              if (inIdx >= 0) {
                                  val inBuf = audioEncoder.getInputBuffer(inIdx)!!
                                  inBuf.clear()
                                  val read = fis.read(readBuf, 0, minOf(readBuf.size, inBuf.remaining()))
                                  val ptsUs = ((totalReadBytes / bytesPerSecond) * 1_000_000.0).toLong()
                                  if (read <= 0) {
                                      audioEncoder.queueInputBuffer(inIdx, 0, 0, ptsUs, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                      audioInputDone = true
                                  } else {
                                      inBuf.put(readBuf, 0, read)
                                      audioEncoder.queueInputBuffer(inIdx, 0, read, ptsUs, 0)
                                      totalReadBytes += read
                                  }
                              }
                              while (true) {
                                  val outIdx = audioEncoder.dequeueOutputBuffer(aInfo, 10_000)
                                  if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                      outAudioFormat = audioEncoder.outputFormat
                                  } else if (outIdx >= 0) {
                                      val outBuf = audioEncoder.getOutputBuffer(outIdx)!!
                                      if ((aInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && aInfo.size > 0) {
                                          val bytes = ByteArray(aInfo.size)
                                          outBuf.position(aInfo.offset)
                                          outBuf.limit(aInfo.offset + aInfo.size)
                                          outBuf.get(bytes)
                                          audioPackets.add(EncodedPacket(bytes, aInfo.presentationTimeUs, aInfo.flags))
                                      }
                                      audioEncoder.releaseOutputBuffer(outIdx, false)
                                  } else break
                              }
                          }

                          while (true) {
                              val outIdx = audioEncoder.dequeueOutputBuffer(aInfo, 10_000)
                              if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                  outAudioFormat = audioEncoder.outputFormat
                              } else if (outIdx >= 0) {
                                  val outBuf = audioEncoder.getOutputBuffer(outIdx)!!
                                  if ((aInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && aInfo.size > 0) {
                                      val bytes = ByteArray(aInfo.size)
                                      outBuf.position(aInfo.offset)
                                      outBuf.limit(aInfo.offset + aInfo.size)
                                      outBuf.get(bytes)
                                      audioPackets.add(EncodedPacket(bytes, aInfo.presentationTimeUs, aInfo.flags))
                                  }
                                  audioEncoder.releaseOutputBuffer(outIdx, false)
                                  if ((aInfo.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
                              } else break
                          }
                      }
                  }
                  audioEncoder.stop()
                  audioEncoder.release()

                  val vTrack = outVideoFormat?.let { muxer.addTrack(it) } ?: -1
                  val aTrack = outAudioFormat?.let { muxer.addTrack(it) } ?: -1

                  if (vTrack >= 0) {
                      muxer.start()
                      val writeInfo = MediaCodec.BufferInfo()
                      for (pkt in videoPackets) {
                          val bb = ByteBuffer.wrap(pkt.data)
                          writeInfo.set(0, pkt.data.size, pkt.ptsUs, pkt.flags)
                          muxer.writeSampleData(vTrack, bb, writeInfo)
                      }
                      if (aTrack >= 0) {
                          for (pkt in audioPackets) {
                              val bb = ByteBuffer.wrap(pkt.data)
                              writeInfo.set(0, pkt.data.size, pkt.ptsUs, pkt.flags)
                              muxer.writeSampleData(aTrack, bb, writeInfo)
                          }
                      }
                      muxer.stop()
                  }
                  muxer.release()
              }

              private fun fillYuv420ImageFromBitmap(img: Image, bmp: android.graphics.Bitmap, width: Int, height: Int) {
                  val argb = IntArray(width * height)
                  bmp.getPixels(argb, 0, width, 0, 0, width, height)

                  val yPlane = img.planes[0]
                  val uPlane = img.planes[1]
                  val vPlane = img.planes[2]

                  val yBuf = yPlane.buffer
                  val uBuf = uPlane.buffer
                  val vBuf = vPlane.buffer

                  val yRowStride = yPlane.rowStride
                  val yPixStride = yPlane.pixelStride
                  val uRowStride = uPlane.rowStride
                  val uPixStride = uPlane.pixelStride
                  val vRowStride = vPlane.rowStride
                  val vPixStride = vPlane.pixelStride

                  for (j in 0 until height) {
                      for (i in 0 until width) {
                          val c = argb[j * width + i]
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF

                          val y = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          yBuf.put(j * yRowStride + i * yPixStride, y.coerceIn(0, 255).toByte())

                          if (j % 2 == 0 && i % 2 == 0) {
                              val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                              val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                              val uvRow = j / 2
                              val uvCol = i / 2
                              uBuf.put(uvRow * uRowStride + uvCol * uPixStride, u.coerceIn(0, 255).toByte())
                              vBuf.put(uvRow * vRowStride + uvCol * vPixStride, v.coerceIn(0, 255).toByte())
                          }
                      }
                  }
              }

              private fun bitmapToNv12(bmp: android.graphics.Bitmap, width: Int, height: Int): ByteArray {
                  val argb = IntArray(width * height)
                  bmp.getPixels(argb, 0, width, 0, 0, width, height)
                  val yuv = ByteArray(width * height * 3 / 2)
                  var yIndex = 0
                  var uvIndex = width * height
                  for (j in 0 until height) {
                      for (i in 0 until width) {
                          val c = argb[j * width + i]
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF
                          val y = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                          val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                          yuv[yIndex++] = y.coerceIn(0, 255).toByte()
                          if (j % 2 == 0 && i % 2 == 0 && uvIndex + 1 < yuv.size) {
                              yuv[uvIndex++] = u.coerceIn(0, 255).toByte()
                              yuv[uvIndex++] = v.coerceIn(0, 255).toByte()
                          }
                      }
                  }
                  return yuv
              }
          }
          EOF

      - name: Gerar Avatar Low-Poly 3D Fiel ao Modelo Enviado (Malha de Triangulos Simetrica)
        run: |
          pip install pillow
          python3 -c '
          import glob, os
          from PIL import Image, ImageDraw

          res_dir = "app/src/main/res/drawable"
          for name in ["reporter_closed", "reporter_open", "reporter_o", "reporter_a", "reporter_e", "reporter_i", "avatar_grid_2x2"]:
              for f in glob.glob(os.path.join(res_dir, f"{name}.*")):
                  os.remove(f)

          def render_model_avatar(phoneme):
              # Renderiza em 300x300 com malha de triangulos low-poly identica a imagem de referencia e amplia 2x (600x600)
              S = 300
              img = Image.new("RGB", (S, S), (255, 255, 255))
              d = ImageDraw.Draw(img)

              def sym_poly(pts, col_left, col_right=None):
                  if col_right is None:
                      col_right = col_left
                  d.polygon(pts, fill=col_left)
                  r_pts = [(S - x, y) for (x, y) in pts]
                  d.polygon(r_pts, fill=col_right)

              # 1. PESCOCO MUSCULOSO E PEITORAL VISIVEL (TOM DOURADO/BRONZEADO DA IMAGEM)
              sym_poly([(85, 200), (150, 200), (150, 285), (75, 255)], (209, 126, 36), (196, 115, 30))
              # Sombra triangular embaixo do queixo
              sym_poly([(100, 208), (150, 222), (150, 248), (94, 228)], (166, 92, 20), (156, 84, 18))
              # Iluminacao lateral dos tendoes do pescoco
              sym_poly([(82, 198), (102, 212), (96, 255), (72, 238)], (218, 136, 42), (204, 124, 36))
              # V do peito aberto na gola
              sym_poly([(102, 245), (150, 245), (150, 292), (118, 275)], (224, 146, 52), (210, 134, 44))

              # 2. CAMISA AZUL LOW-POLY COM MALHA DE TRIANGULOS VISIVEL
              # Ombros externos
              sym_poly([(0, 276), (54, 250), (36, 300), (0, 300)], (102, 136, 204), (94, 126, 194))
              sym_poly([(54, 250), (78, 268), (68, 300), (36, 300)], (88, 120, 188), (82, 112, 178))
              sym_poly([(78, 268), (118, 282), (114, 300), (68, 300)], (76, 108, 174), (70, 100, 164))
              # Gola alta dobrada (Colarinho azul)
              sym_poly([(68, 222), (84, 208), (96, 252), (56, 250)], (92, 124, 190), (84, 114, 180))
              # Pontas do colarinho
              sym_poly([(56, 250), (96, 252), (124, 288), (74, 286)], (108, 142, 210), (98, 132, 200))
              # Sombra interna da gola
              sym_poly([(96, 252), (106, 248), (132, 292), (124, 288)], (52, 78, 136), (48, 72, 128))
              # Fechamento central da camisa
              sym_poly([(124, 288), (150, 284), (150, 300), (114, 300)], (84, 116, 184), (74, 104, 172))

              # 3. ORELHAS GEOMETRICAS
              sym_poly([(64, 116), (78, 112), (78, 162), (66, 154)], (206, 126, 38), (194, 116, 34))
              sym_poly([(68, 124), (76, 122), (76, 150), (70, 146)], (158, 88, 22), (148, 80, 18))

              # 4. ROSTO LOW-POLY (FACETAS GEOMETRICAS LARANJA-DOURADO FIEL A IMAGEM)
              # Testa central e lateral
              sym_poly([(110, 62), (150, 64), (150, 102), (108, 98)], (242, 166, 62), (234, 156, 56))
              sym_poly([(80, 68), (110, 62), (108, 98), (78, 106)], (228, 148, 48), (216, 136, 42))
              # Macas do rosto (bochecha superior)
              sym_poly([(78, 106), (112, 118), (106, 152), (78, 148)], (232, 152, 52), (220, 140, 46))
              sym_poly([(112, 118), (136, 118), (132, 152), (106, 152)], (240, 162, 58), (230, 150, 52))
              # Lateral da mandibula (sombreada)
              sym_poly([(78, 148), (106, 152), (98, 192), (82, 180)], (198, 118, 32), (186, 108, 28))
              # Bochecha inferior e linha do sorriso
              sym_poly([(106, 152), (132, 152), (124, 196), (98, 192)], (222, 142, 46), (212, 132, 40))
              # Queixo forte quadrado e plano frontal
              sym_poly([(98, 192), (124, 196), (128, 218), (112, 216)], (206, 126, 38), (196, 116, 32))
              sym_poly([(124, 196), (150, 196), (150, 220), (128, 218)], (228, 148, 50), (218, 138, 44))

              # 5. NARIZ POLIGONAL DEFINIDO
              # Dorso do nariz
              sym_poly([(141, 102), (150, 102), (150, 146), (139, 146)], (246, 174, 70), (232, 156, 56))
              # Parede lateral do nariz
              sym_poly([(130, 116), (141, 102), (139, 146), (128, 148)], (208, 128, 38), (194, 114, 32))
              # Base inferior do nariz
              sym_poly([(128, 148), (139, 146), (150, 146), (150, 154), (134, 154)], (176, 100, 24), (166, 92, 20))
              # Filtro nasal (acima do labio)
              sym_poly([(136, 154), (150, 154), (150, 165), (134, 165)], (216, 136, 42), (206, 126, 38))

              # 6. OLHOS E SOBRANCELHAS GROSSAS ESCURAS
              # Sombra da orbita ocular
              sym_poly([(90, 102), (136, 106), (134, 122), (88, 118)], (184, 106, 26), (176, 98, 24))
              # Esclera branca
              sym_poly([(94, 110), (128, 111), (125, 121), (97, 121)], (248, 248, 248), (248, 248, 248))
              # Iris e pupila escura grande (fiel ao modelo)
              for cx in [112, 188]:
                  d.polygon([(cx-8, 110), (cx+8, 110), (cx+7, 121), (cx-7, 121)], fill=(42, 22, 12))
                  d.polygon([(cx-5, 111), (cx+5, 111), (cx+5, 120), (cx-5, 120)], fill=(12, 8, 6))
                  # Brilho branco no canto superior esquerdo da pupila
                  d.rectangle([cx-4, 112, cx-1, 115], fill=(255, 255, 255))
              # Palpebra superior marcada
              sym_poly([(92, 108), (130, 110), (128, 113), (94, 111)], (36, 18, 10), (36, 18, 10))
              # Sobrancelhas grossas angulares inclinadas para o centro
              sym_poly([(86, 98), (112, 94), (138, 102), (135, 110), (110, 102), (88, 104)], (34, 16, 8), (34, 16, 8))

              # 7. CABELO CASTANHO ESCURO LOW-POLY VOLUMOSO COM FACETAS TRIANGULARES
              # Costeletas e laterais
              sym_poly([(66, 72), (82, 64), (78, 116), (68, 114)], (44, 20, 10), (38, 16, 8))
              sym_poly([(62, 42), (86, 38), (82, 64), (66, 72)], (56, 26, 12), (48, 22, 10))
              # Topo e franja facetada (com leve bico de viuva no centro da testa)
              sym_poly([(82, 64), (114, 58), (138, 64), (150, 68), (150, 44), (110, 40)], (64, 30, 14), (54, 24, 12))
              sym_poly([(76, 24), (116, 12), (110, 40), (62, 42)], (78, 38, 18), (66, 32, 14))
              sym_poly([(116, 12), (150, 8), (150, 44), (110, 40)], (92, 46, 22), (74, 36, 16))
              # Detalhes de luz poligonal no topo do cabelo
              d.polygon([(102, 18), (136, 14), (124, 34), (94, 32)], fill=(106, 54, 26))
              d.polygon([(150, 14), (186, 18), (176, 34), (150, 32)], fill=(84, 42, 20))

              # 8. QUATRO EXPRESSOES DE BOCA EXATAS DO MODELO (A, E, I, O)
              if phoneme == "A":
                  # Top-Left: Boca aberta grande arredondada/trapezoidal mostrando dentes superiores, lingua e fundo escuro
                  d.polygon([(118, 164), (150, 162), (182, 164), (186, 178), (176, 195), (150, 198), (124, 195), (114, 178)], fill=(156, 84, 36))
                  d.polygon([(121, 167), (150, 165), (179, 167), (182, 178), (173, 191), (150, 194), (127, 191), (118, 178)], fill=(38, 14, 14))
                  # Dentes superiores brancos
                  d.polygon([(125, 167), (175, 167), (173, 173), (127, 173)], fill=(246, 246, 246))
                  # Lingua avermelhada/escura no fundo
                  d.polygon([(130, 183), (170, 183), (172, 191), (150, 193), (128, 191)], fill=(112, 44, 42))
              elif phoneme == "E":
                  # Top-Right: Boca aberta mais larga mostrando dentes superiores, fundo escuro e faixa de dentes inferiores
                  d.polygon([(112, 164), (150, 163), (188, 164), (184, 185), (168, 192), (132, 192), (116, 185)], fill=(156, 84, 36))
                  d.polygon([(116, 167), (184, 167), (180, 182), (166, 188), (134, 188), (120, 182)], fill=(42, 16, 16))
                  # Dentes superiores
                  d.polygon([(120, 167), (180, 167), (178, 173), (122, 173)], fill=(246, 246, 246))
                  # Dentes inferiores
                  d.polygon([(126, 182), (174, 182), (166, 187), (134, 187)], fill=(236, 236, 236))
              elif phoneme == "I":
                  # Bottom-Left: Sorriso largo esticado com dentes cerrados brancos visiveis
                  d.polygon([(112, 167), (188, 167), (184, 183), (168, 187), (132, 187), (116, 183)], fill=(156, 84, 36))
                  d.polygon([(117, 170), (183, 170), (179, 181), (166, 184), (134, 184), (121, 181)], fill=(244, 244, 244))
                  # Linha horizontal sutil entre as arcadas dentarias
                  d.line([(119, 176), (181, 176)], fill=(160, 155, 150), width=1)
              elif phoneme == "O":
                  # Bottom-Right: Boca pequena franzida em formato O com labios carnudos
                  d.polygon([(130, 164), (150, 162), (170, 164), (174, 178), (166, 193), (150, 195), (134, 193), (126, 178)], fill=(182, 102, 42))
                  d.polygon([(136, 170), (150, 168), (164, 170), (166, 178), (160, 185), (150, 186), (140, 185), (134, 178)], fill=(32, 12, 12))

              # Amplia para 600x600 usando NEAREST para manter as arestas poligonais nitidas de videogame 3D
              return img.resize((600, 600), Image.Resampling.NEAREST)

          img_a = render_model_avatar("A")
          img_e = render_model_avatar("E")
          img_i = render_model_avatar("I")
          img_o = render_model_avatar("O")

          # Salvar os 4 fonemas
          img_a.save(os.path.join(res_dir, "reporter_a.png"), "PNG")
          img_e.save(os.path.join(res_dir, "reporter_e.png"), "PNG")
          img_i.save(os.path.join(res_dir, "reporter_i.png"), "PNG")
          img_o.save(os.path.join(res_dir, "reporter_o.png"), "PNG")

          # Mapear para os 3 recursos usados pelo motor de renderizacao do app
          img_i.save(os.path.join(res_dir, "reporter_closed.png"), "PNG")
          img_e.save(os.path.join(res_dir, "reporter_open.png"), "PNG")

          # Salvar tambem a grade 2x2 identica a referencia
          grid = Image.new("RGB", (1204, 1204), (0, 0, 0))
          grid.paste(img_a, (0, 0))
          grid.paste(img_e, (604, 0))
          grid.paste(img_i, (0, 604))
          grid.paste(img_o, (604, 604))
          grid.save(os.path.join(res_dir, "avatar_grid_2x2.png"), "PNG")
          '

