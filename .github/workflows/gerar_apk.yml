                  (256, 386), (300, 394), (344, 386),
                  (398, 335), (414, 265), (416, 175),
                  (375, 118), (300, 108), (225, 118)
              ]
              draw.polygon(face_pts, fill=(214, 166, 134))

              # Iluminacao 3D nas bochechas, testa e mandibula
              shade = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              sh_draw = ImageDraw.Draw(shade)
              sh_draw.ellipse([215, 125, 385, 220], fill=(242, 202, 174, 110))
              sh_draw.ellipse([200, 230, 275, 300], fill=(238, 195, 165, 80))
              sh_draw.ellipse([325, 230, 400, 300], fill=(238, 195, 165, 80))
              sh_draw.polygon([(184, 250), (202, 335), (245, 378), (225, 260)], fill=(158, 112, 84, 120))
              sh_draw.polygon([(416, 250), (398, 335), (355, 378), (375, 260)], fill=(158, 112, 84, 120))
              shade = shade.filter(ImageFilter.GaussianBlur(14))
              img = Image.alpha_composite(img, shade)

              # Barba curta por fazer (castanho escuro, uniforme)
              beard = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              bdraw = ImageDraw.Draw(beard)
              beard_pts = [
                  (188, 258), (202, 335), (256, 386), (300, 394),
                  (344, 386), (398, 335), (412, 258),
                  (388, 296), (348, 314), (300, 310), (252, 314), (212, 296)
              ]
              bdraw.polygon(beard_pts, fill=(46, 34, 28, 125))
              # Bigode e cavanhaque conectado
              bdraw.polygon([(252, 312), (300, 304), (348, 312), (356, 332), (300, 326), (244, 332)], fill=(42, 30, 24, 155))
              bdraw.rectangle([290, 342, 310, 382], fill=(42, 30, 24, 130))
              beard = beard.filter(ImageFilter.GaussianBlur(4))
              img = Image.alpha_composite(img, beard)
              draw = ImageDraw.Draw(img)

              # Nariz masculino definido e proporcional
              draw.polygon([(300, 222), (283, 292), (300, 301), (317, 292)], fill=(196, 146, 114))
              draw.line([(298, 224), (298, 290)], fill=(235, 194, 166), width=4)
              draw.ellipse([282, 290, 294, 298], fill=(135, 92, 68))
              draw.ellipse([306, 290, 318, 298], fill=(135, 92, 68))

              # Olhos castanho escuro, expressao seria e confiante
              for cx in [248, 352]:
                  draw.polygon([(cx-26, 232), (cx-10, 222), (cx+12, 222), (cx+26, 232), (cx+12, 241), (cx-12, 241)], fill=(246, 246, 248))
                  draw.ellipse([cx-11, 221, cx+11, 241], fill=(58, 36, 22))
                  draw.ellipse([cx-5, 226, cx+5, 236], fill=(14, 10, 8))
                  draw.ellipse([cx-7, 224, cx-2, 229], fill=(255, 255, 255))
                  draw.line([(cx-27, 231), (cx-10, 221), (cx+12, 221), (cx+27, 231)], fill=(30, 20, 15), width=3)

              # Sobrancelhas grossas castanho escuro
              draw.polygon([(214, 212), (235, 202), (278, 210), (275, 219), (236, 212)], fill=(38, 26, 20))
              draw.polygon([(386, 212), (365, 202), (322, 210), (325, 219), (364, 212)], fill=(38, 26, 20))

              # Cabelo castanho escuro volumoso, ondulado e penteado para tras
              hair_pts = [
                  (178, 235), (168, 175), (185, 118), (232, 76),
                  (300, 64), (368, 76), (415, 118), (432, 175),
                  (422, 235), (406, 182), (382, 144), (336, 132),
                  (300, 138), (264, 132), (218, 144), (194, 182)
              ]
              draw.polygon(hair_pts, fill=(36, 24, 18))
              # Ondas volumosas no topo
              draw.chord([195, 58, 330, 148], 0, 360, fill=(44, 30, 22))
              draw.chord([270, 54, 405, 145], 0, 360, fill=(32, 21, 15))
              draw.arc([210, 72, 385, 140], 185, 355, fill=(64, 45, 34), width=4)
              draw.arc([230, 86, 365, 150], 185, 355, fill=(58, 40, 30), width=3)

              # Variacoes apenas na expressao bucal
              if mouth_mode == "closed":
                  draw.polygon([(266, 334), (288, 329), (300, 332), (312, 329), (334, 334), (300, 336)], fill=(162, 102, 92))
                  draw.polygon([(268, 335), (332, 335), (316, 344), (284, 344)], fill=(178, 116, 105))
                  draw.line([(265, 335), (300, 336), (335, 335)], fill=(96, 52, 46), width=2)
              elif mouth_mode == "open":
                  draw.polygon([(265, 331), (288, 326), (300, 329), (312, 326), (335, 331), (315, 348), (285, 348)], fill=(172, 108, 98))
                  draw.polygon([(274, 333), (326, 333), (316, 342), (284, 342)], fill=(54, 22, 24))
                  draw.line([(282, 334), (318, 334)], fill=(232, 228, 224), width=2)
              elif mouth_mode == "o":
                  draw.ellipse([281, 322, 319, 356], fill=(168, 104, 94))
                  draw.ellipse([287, 327, 313, 351], fill=(48, 18, 20))

              img.convert("RGB").save(out_path, "PNG")

          render_avatar("closed", os.path.join(res_dir, "reporter_closed.png"))
          render_avatar("open", os.path.join(res_dir, "reporter_open.png"))
          render_avatar("o", os.path.join(res_dir, "reporter_o.png"))
          '

      - name: Compilar APK
        run: gradle assembleDebug assembleRelease

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: JornalForge-APK-Pronto
          path: |
            JornalForge_Android/app/build/outputs/apk/debug/app-debug.apk
            JornalForge_Android/app/build/outputs/apk/release/app-release.apk
