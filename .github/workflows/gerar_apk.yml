name: Gerar APK JornalForge

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./JornalForge_Android

    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ajustar Manifesto, Dependencias, Titulo (+20% Adicional) e Opcao 57s
        run: |
          python3 -c '
          import re, os

          open("gradle.properties", "w").write("org.gradle.jvmargs=-Xmx4096m\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n")

          m = "app/src/main/AndroidManifest.xml"
          txt = open(m).read()
          txt = txt.replace("FOREGROUND_SERVICE_MEDIA_PROCESSING", "FOREGROUND_SERVICE_DATA_SYNC")
          txt = txt.replace("mediaProcessing", "dataSync")
          open(m, "w").write(txt)

          b = "app/build.gradle.kts"
          lines = [l for l in open(b) if "ffmpeg-kit" not in l]
          open(b, "w").writelines(lines)

          # Ajustar FrameRenderer.kt:
          # 1. Remover qualquer ColorFilter azulado
          # 2. Aumentar o TITULO em mais 20% (totalizando +62% sobre o original) e textos secundarios em +14%
          # 3. Ajustar quebra de linha e margem de seguranca para o titulo nunca sair da tela nem invadir o avatar
          fr_path = "app/src/main/java/com/jornalforge/app/video/FrameRenderer.kt"
          if os.path.exists(fr_path):
              fr = open(fr_path).read()
              fr = re.sub(r"\.colorFilter\s*=\s*[^\n]+", "", fr)

              sizes = [float(x) for x in re.findall(r"textSize\s*=\s*(\d+(?:\.\d+)?)f", fr)]
              max_size = max(sizes) if sizes else 40.0

              def boost_font_smart(match):
                  prefix = match.group(1)
                  val = float(match.group(2))
                  if val >= max_size * 0.85:
                      # Aumenta +20% sobre o ajuste anterior (1.35 * 1.20 = 1.62x)
                      new_val = round(val * 1.62, 1)
                  else:
                      new_val = round(val * 1.14, 1)
                  return f"{prefix}{new_val}f"

              fr = re.sub(r"(textSize\s*=\s*)(\d+(?:\.\d+)?)f", boost_font_smart, fr)

              def shrink_line_chars(match):
                  prefix = match.group(1)
                  val = int(match.group(2))
                  if val <= 28:
                      # Reduz proporcionalmente os caracteres por linha do titulo para caber com folga na tela
                      new_val = max(11, int(val * 0.60))
                  else:
                      new_val = max(18, int(val * 0.85))
                  return f"{prefix}{new_val}"

              fr = re.sub(r"(maxCharsPerLine\s*=\s*|wrapText\([^,]+,\s*)(\d+)", shrink_line_chars, fr)
              open(fr_path, "w").write(fr)

          # Ajustar ScriptParser.kt para suportar duracao <= 57 segundos (quando durationMinutes == 1)
          sp_path = "app/src/main/java/com/jornalforge/app/model/ScriptParser.kt"
          if os.path.exists(sp_path):
              sp = open(sp_path).read()
              old_fn = "fun buildJournalisticPrompt(theme: String, durationMinutes: Int, sourceBase: String): String {"
              new_fn = """fun buildJournalisticPrompt(theme: String, durationMinutes: Int, sourceBase: String): String {
                  if (durationMinutes == 1) {
                      val basePrompt = buildJournalisticPrompt(theme, 4, sourceBase)
                      return "ATENCAO - MODO VIDEO CURTO (SHORTS/REELS): O video final deve ter NO MAXIMO 57 SEGUNDOS de duracao total (gere entre 3 e 5 cenas curtas, totalizando no maximo 115 a 130 palavras de narracao somadas). Ignore qualquer mencao a 4 minutos abaixo e cumpra rigorosamente o limite de 57 segundos.\\n\\n" + basePrompt
                  }"""
              if old_fn in sp and "MODO VIDEO CURTO" not in sp:
                  sp = sp.replace(old_fn, new_fn, 1)
                  open(sp_path, "w").write(sp)
          '

      - name: Atualizar MainActivity, Service (com Alternancia Dinamica de Boca) e Muxer
        run: |
          cat << 'EOF' > app/src/main/java/com/jornalforge/app/MainActivity.kt
          @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)
          package com.jornalforge.app

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.jornalforge.app.audio.PiperTtsEngine
          import com.jornalforge.app.model.ScriptParser
          import com.jornalforge.app.model.VideoAspect
          import com.jornalforge.app.service.ExportStatus
          import com.jornalforge.app.service.VideoExportService
          import java.io.BufferedReader
          import java.io.InputStreamReader

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Color(0xFFD92323),
                              onPrimary = Color.White,
                              background = Color(0xFF0B0E14),
                              surface = Color(0xFF151A24),
                              onSurface = Color(0xFFECEFF4)
                          )
                      ) {
                          JornalForgeScreen()
                      }
                  }
              }
          }

          @Composable
          fun JornalForgeScreen() {
              val context = LocalContext.current
              val scrollState = rememberScrollState()
              val exportStatus by VideoExportService.statusFlow.collectAsState()

              var themeText by remember { mutableStateOf("") }
              var selectedDuration by remember { mutableStateOf(6) }
              var sourceBaseText by remember { mutableStateOf("") }

              var jsonInput by remember { mutableStateOf("") }
              var validationMessage by remember { mutableStateOf("Aguardando colagem ou importação do JSON.") }
              var isJsonValid by remember { mutableStateOf(false) }

              var selectedAspect by remember { mutableStateOf(VideoAspect.HORIZONTAL_16_9) }
              var rmsThreshold by remember { mutableStateOf(520f) }

              val filePickerLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.OpenDocument()
              ) { uri: Uri? ->
                  uri?.let {
                      try {
                          context.contentResolver.openInputStream(it)?.use { stream ->
                              val content = BufferedReader(InputStreamReader(stream)).readText()
                              jsonInput = content
                              val res = ScriptParser.validateAndNormalize(content)
                              res.onSuccess { script ->
                                  isJsonValid = true
                                  validationMessage = "JSON Válido! Título: '${script.videoTitle}' | ${script.scenes.size} cenas normalizadas."
                              }.onFailure { err ->
                                  isJsonValid = false
                                  validationMessage = "Erro: ${err.localizedMessage}"
                              }
                          }
                      } catch (e: Exception) {
                          validationMessage = "Erro ao ler arquivo: ${e.localizedMessage}"
                      }
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0B0E14))
                      .verticalScroll(scrollState)
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Box(
                          modifier = Modifier
                              .width(6.dp)
                              .height(34.dp)
                              .background(Color(0xFFD92323))
                      )
                      Spacer(modifier = Modifier.width(10.dp))
                      Column {
                          Text(
                              text = "JORNALFORGE ANDROID",
                              color = Color.White,
                              fontSize = 22.sp,
                              fontWeight = FontWeight.ExtraBold
                          )
                          Text(
                              text = "Gerador Jornalístico • Voz Faber PT-BR • Exportação MP4 Única",
                              color = Color(0xFF9AA5B8),
                              fontSize = 12.sp
                          )
                      }
                  }

                  StepCard(title = "ETAPA 1 • Fonte e Configuração") {
                      OutlinedTextField(
                          value = themeText,
                          onValueChange = { themeText = it },
                          label = { Text("Tema (Ex: O verdadeiro interesse por trás de uma decisão)") },
                          modifier = Modifier.fillMaxWidth(),
                          singleLine = true
                      )

                      Spacer(modifier = Modifier.height(8.dp))
                      Text("Duração aproximada:", color = Color(0xFFB8C2D4), fontSize = 13.sp)
                      Row(
                          horizontalArrangement = Arrangement.spacedBy(6.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          listOf(1, 4, 6, 8, 10).forEach { min ->
                              val labelText = if (min == 1) "≤ 57s" else "$min min"
                              FilterChip(
                                  selected = selectedDuration == min,
                                  onClick = { selectedDuration = min },
                                  label = { Text(labelText, fontSize = 12.sp) }
                              )
                          }
                      }

                      OutlinedTextField(
                          value = sourceBaseText,
                          onValueChange = { sourceBaseText = it },
                          label = { Text("Fonte-base (Artigo, transcrição, resumo ou contexto)") },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(130.dp)
                      )

                      if (sourceBaseText.trim().startsWith("http://") || sourceBaseText.trim().startsWith("https://")) {
                          Text(
                              text = "⚠️ Você colou um link. Para máxima fidelidade jornalística, forneça também a transcrição ou resumo do conteúdo-base.",
                              color = Color(0xFFFFB74D),
                              fontSize = 12.sp,
                              modifier = Modifier.padding(top = 4.dp)
                          )
                      }

                      Spacer(modifier = Modifier.height(8.dp))
                      Button(
                          onClick = {
                              if (themeText.isBlank() || sourceBaseText.isBlank()) {
                                  Toast.makeText(context, "Preencha o tema e a fonte-base.", Toast.LENGTH_SHORT).show()
                              } else {
                                  val prompt = ScriptParser.buildJournalisticPrompt(themeText, selectedDuration, sourceBaseText)
                                  val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                  clipboard.setPrimaryClip(ClipData.newPlainText("Prompt JornalForge", prompt))
                                  Toast.makeText(context, "Prompt jornalístico gerado e copiado!", Toast.LENGTH_LONG).show()
                              }
                          },
                          modifier = Modifier.fillMaxWidth(),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD92323))
                      ) {
                          Text("Gerar e copiar prompt", fontWeight = FontWeight.Bold)
                      }
                  }

                  StepCard(title = "ETAPA 2 • Importação e Validação do JSON") {
                      OutlinedTextField(
                          value = jsonInput,
                          onValueChange = {
                              jsonInput = it
                              isJsonValid = false
                          },
                          label = { Text("Cole aqui o roteiro JSON retornado pela IA") },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(150.dp)
                      )

                      Spacer(modifier = Modifier.height(8.dp))
                      Row(
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          OutlinedButton(
                              onClick = {
                                  val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                  val clipText = clipboard.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                                  if (clipText.isNotEmpty()) {
                                      jsonInput = clipText
                                  }
                              },
                              modifier = Modifier.weight(1f)
                          ) {
                              Text("Colar Área Transf.", fontSize = 12.sp)
                          }

                          OutlinedButton(
                              onClick = {
                                  filePickerLauncher.launch(arrayOf("application/json", "text/plain"))
                              },
                              modifier = Modifier.weight(1f)
                          ) {
                              Text("Importar .json/.txt", fontSize = 12.sp)
                          }
                      }

                      Spacer(modifier = Modifier.height(8.dp))
                      Button(
                          onClick = {
                              val result = ScriptParser.validateAndNormalize(jsonInput)
                              result.onSuccess { script ->
                                  isJsonValid = true
                                  validationMessage = "✅ Estrutura válida! Título: \"${script.videoTitle}\" | ${script.scenes.size} cenas prontas."
                              }.onFailure { err ->
                                  isJsonValid = false
                                  validationMessage = "❌ ${err.localizedMessage}"
                              }
                          },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Validar estrutura", fontWeight = FontWeight.Bold)
                      }

                      Spacer(modifier = Modifier.height(6.dp))
                      Text(
                          text = validationMessage,
                          color = if (isJsonValid) Color(0xFF66BB6A) else Color(0xFFFFCA28),
                          fontSize = 13.sp
                      )
                  }

                  StepCard(title = "ETAPA 3 • Formato e Geração de Vídeo Único") {
                      VideoAspect.values().forEach { aspect ->
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              RadioButton(
                                  selected = selectedAspect == aspect,
                                  onClick = { selectedAspect = aspect }
                              )
                              Text(text = aspect.label, color = Color.White, fontSize = 14.sp)
                          }
                      }

                      Spacer(modifier = Modifier.height(8.dp))
                      Row(
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Button(
                              onClick = {
                                  val validation = ScriptParser.validateAndNormalize(jsonInput)
                                  if (validation.isFailure) {
                                      validationMessage = "❌ Valide um JSON correto antes de gerar: ${validation.exceptionOrNull()?.localizedMessage}"
                                      return@Button
                                  }
                                  val intent = Intent(context, VideoExportService::class.java).apply {
                                      action = VideoExportService.ACTION_START
                                      putExtra(VideoExportService.EXTRA_JSON, jsonInput)
                                      putExtra(VideoExportService.EXTRA_ASPECT, selectedAspect.name)
                                      putExtra(VideoExportService.EXTRA_RMS_THRESHOLD, rmsThreshold.toDouble())
                                      putExtra(VideoExportService.EXTRA_QUICK_TEST, false)
                                  }
                                  context.startForegroundService(intent)
                              },
                              modifier = Modifier.weight(1f),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD92323))
                          ) {
                              Text("Gerar vídeo MP4", fontWeight = FontWeight.Bold)
                          }

                          OutlinedButton(
                              onClick = {
                                  val intent = Intent(context, VideoExportService::class.java).apply {
                                      action = VideoExportService.ACTION_START
                                      putExtra(VideoExportService.EXTRA_ASPECT, selectedAspect.name)
                                      putExtra(VideoExportService.EXTRA_RMS_THRESHOLD, rmsThreshold.toDouble())
                                      putExtra(VideoExportService.EXTRA_QUICK_TEST, true)
                                  }
                                  context.startForegroundService(intent)
                              }
                          ) {
                              Text("Modo Teste (10s)", fontSize = 12.sp)
                          }
                      }

                      when (val st = exportStatus) {
                          is ExportStatus.Running -> {
                              Spacer(modifier = Modifier.height(12.dp))
                              LinearProgressIndicator(
                                  progress = st.progressPercent / 100f,
                                  modifier = Modifier.fillMaxWidth(),
                                  color = Color(0xFFD92323)
                              )
                              Spacer(modifier = Modifier.height(6.dp))
                              Text("Fase atual: ${st.phase} (${st.progressPercent}%)", color = Color.White, fontSize = 13.sp)
                              TextButton(
                                  onClick = {
                                      val cancelIntent = Intent(context, VideoExportService::class.java).apply {
                                          action = VideoExportService.ACTION_CANCEL
                                      }
                                      context.startService(cancelIntent)
                                  }
                              ) {
                                  Text("Cancelar Exportação", color = Color(0xFFEF5350))
                              }
                          }
                          is ExportStatus.Completed -> {
                              Spacer(modifier = Modifier.height(12.dp))
                              Text("✅ Vídeo finalizado e salvo na Galeria (${st.displayPath})!", color = Color(0xFF66BB6A), fontWeight = FontWeight.Bold)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(onClick = {
                                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                                          type = "video/mp4"
                                          putExtra(Intent.EXTRA_STREAM, st.galleryUri)
                                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      }
                                      context.startActivity(Intent.createChooser(shareIntent, "Compartilhar Reportagem MP4"))
                                  }) {
                                      Text("Compartilhar MP4")
                                  }
                                  OutlinedButton(onClick = {
                                      val viewIntent = Intent(Intent.ACTION_VIEW).apply {
                                          setDataAndType(st.galleryUri, "video/mp4")
                                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      }
                                      context.startActivity(viewIntent)
                                  }) {
                                      Text("Abrir Vídeo")
                                  }
                              }
                          }
                          is ExportStatus.Failed -> {
                              Spacer(modifier = Modifier.height(12.dp))
                              Text("❌ Erro em [${st.exactPhase}]: ${st.details}", color = Color(0xFFEF5350), fontSize = 13.sp)
                          }
                          ExportStatus.Idle -> {}
                      }
                  }

                  StepCard(title = "ETAPA 4 • Voz Faber e Avatar Alinhado") {
                      val offlineReady = remember { PiperTtsEngine(context).isOfflineFaberModelInstalled() }
                      Text("• Voz Faber - Português Brasileiro (pt_BR-faber-medium.onnx)", color = Color.White, fontSize = 13.sp)
                      Text("• Motor Piper integrado | Velocidade 0.95 (Fala pausada e eloquente)", color = Color(0xFFB8C2D4), fontSize = 13.sp)
                      Text(
                          text = if (offlineReady) "• Status da Síntese: 100% Offline no Dispositivo (ONNX NDK)"
                                 else "• Status da Síntese: Arquitetura Híbrida Ativa",
                          color = Color(0xFF81C784),
                          fontSize = 12.sp
                      )
                      Text("• Avatar de reportagem centralizado (Escala 60% anti-sobreposição)", color = Color(0xFFB8C2D4), fontSize = 13.sp)
                      Text("• Alternância dinâmica de boca ativa durante toda a fala", color = Color(0xFFB8C2D4), fontSize = 13.sp)

                      Spacer(modifier = Modifier.height(8.dp))
                      Text("Limiar RMS de Pausa Vocal: ${rmsThreshold.toInt()} (Padrão: 520 PCM 16-bit)", color = Color.White, fontSize = 12.sp)
                      Slider(
                          value = rmsThreshold,
                          onValueChange = { rmsThreshold = it },
                          valueRange = 200f..1200f
                      )

                      Row(
                          horizontalArrangement = Arrangement.SpaceEvenly,
                          modifier = Modifier.fillMaxWidth().padding(top = 8.dp)
                      ) {
                          AvatarPreviewItem(R.drawable.reporter_closed, "Closed (Pausa)")
                          AvatarPreviewItem(R.drawable.reporter_open, "Open (Fala)")
                          AvatarPreviewItem(R.drawable.reporter_o, "Formato O")
                      }
                  }
              }
          }

          @Composable
          fun StepCard(title: String, content: @Composable ColumnScope.() -> Unit) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(Color(0xFF151A24), RoundedCornerShape(10.dp))
                      .border(1.dp, Color(0xFF263042), RoundedCornerShape(10.dp))
                      .padding(14.dp)
              ) {
                  Text(
                      text = title,
                      color = Color(0xFFD92323),
                      fontWeight = FontWeight.Bold,
                      fontSize = 14.sp
                  )
                  Spacer(modifier = Modifier.height(10.dp))
                  content()
              }
          }

          @Composable
          fun AvatarPreviewItem(resId: Int, label: String) {
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Image(
                      painter = painterResource(id = resId),
                      contentDescription = label,
                      modifier = Modifier
                          .size(80.dp)
                          .border(1.dp, Color(0xFF37474F), RoundedCornerShape(6.dp))
                  )
                  Spacer(modifier = Modifier.height(4.dp))
                  Text(label, color = Color(0xFFB0BEC5), fontSize = 11.sp)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          package com.jornalforge.app.service

          import android.app.*
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.IBinder
          import android.os.StatFs
          import android.provider.MediaStore
          import androidx.core.app.NotificationCompat
          import com.jornalforge.app.audio.MouthState
          import com.jornalforge.app.audio.PiperTtsEngine
          import com.jornalforge.app.audio.SceneAudioData
          import com.jornalforge.app.model.NormalizedScript
          import com.jornalforge.app.model.ScriptParser
          import com.jornalforge.app.model.VideoAspect
          import com.jornalforge.app.video.FrameRenderer
          import com.jornalforge.app.video.SimpleMp4Muxer
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import java.io.File
          import java.io.FileInputStream

          sealed class ExportStatus {
              object Idle : ExportStatus()
              data class Running(val phase: String, val progressPercent: Int) : ExportStatus()
              data class Completed(val galleryUri: Uri, val displayPath: String) : ExportStatus()
              data class Failed(val exactPhase: String, val details: String) : ExportStatus()
          }

          class VideoExportService : Service() {

              companion object {
                  private val _statusFlow = MutableStateFlow<ExportStatus>(ExportStatus.Idle)
                  val statusFlow: StateFlow<ExportStatus> = _statusFlow

                  const val ACTION_START = "com.jornalforge.app.START_EXPORT"
                  const val ACTION_CANCEL = "com.jornalforge.app.CANCEL_EXPORT"
                  const val EXTRA_JSON = "extra_json"
                  const val EXTRA_ASPECT = "extra_aspect"
                  const val EXTRA_RMS_THRESHOLD = "extra_rms"
                  const val EXTRA_QUICK_TEST = "extra_quick_test"
                  private const val CHANNEL_ID = "jornalforge_export_channel"
                  private const val NOTIF_ID = 1001
              }

              private val serviceJob = SupervisorJob()
              private val serviceScope = CoroutineScope(Dispatchers.Default + serviceJob)
              private var currentJob: Job? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_CANCEL -> {
                          currentJob?.cancel()
                          cleanupTempDir()
                          _statusFlow.value = ExportStatus.Failed("Exportação cancelada pelo usuário", "Arquivos temporários removidos.")
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                      }
                      ACTION_START -> {
                          val rawJson = intent.getStringExtra(EXTRA_JSON) ?: ""
                          val aspectName = intent.getStringExtra(EXTRA_ASPECT) ?: VideoAspect.HORIZONTAL_16_9.name
                          val rmsThreshold = intent.getDoubleExtra(EXTRA_RMS_THRESHOLD, PiperTtsEngine.DEFAULT_RMS_THRESHOLD)
                          val isQuickTest = intent.getBooleanExtra(EXTRA_QUICK_TEST, false)
                          val aspect = VideoAspect.valueOf(aspectName)

                          startForeground(NOTIF_ID, buildNotification("Preparando roteiro", 0))
                          currentJob = serviceScope.launch {
                              runPipeline(rawJson, aspect, rmsThreshold, isQuickTest)
                          }
                      }
                  }
                  return START_NOT_STICKY
              }

              private suspend fun runPipeline(
                  rawJson: String,
                  aspect: VideoAspect,
                  rmsThreshold: Double,
                  isQuickTest: Boolean
              ) {
                  val tempRoot = File(cacheDir, "jornalforge_job")
                  try {
                      updatePhase("Preparando roteiro", 5)
                      val script: NormalizedScript = if (isQuickTest) {
                          ScriptParser.getQuickTestScript()
                      } else {
                          ScriptParser.validateAndNormalize(rawJson).getOrElse { err ->
                              failAt("Falha na validação do roteiro", err.localizedMessage ?: "JSON inválido")
                              return
                          }
                      }

                      val stat = StatFs(cacheDir.absolutePath)
                      val availableMegabytes = (stat.availableBlocksLong * stat.blockSizeLong) / (1024 * 1024)
                      if (availableMegabytes < 250) {
                          failAt("Falta de espaço no armazenamento", "Espaço disponível insuficiente ($availableMegabytes MB).")
                          return
                      }

                      if (tempRoot.exists()) tempRoot.deleteRecursively()
                      val wavDir = File(tempRoot, "wavs").apply { mkdirs() }
                      val framesDir = File(tempRoot, "frames").apply { mkdirs() }

                      val ttsEngine = PiperTtsEngine(applicationContext)
                      val sceneAudioList = mutableListOf<SceneAudioData>()
                      val totalScenes = script.scenes.size

                      for ((index, scene) in script.scenes.withIndex()) {
                          currentCoroutineContext().ensureActive()
                          val sceneNum = index + 1
                          val progress = 10 + ((index.toFloat() / totalScenes) * 25).toInt()
                          updatePhase("Gerando narração Faber cena $sceneNum de $totalScenes", progress)

                          val wavFile = File(wavDir, String.format("scene_%04d.wav", sceneNum))
                          val audioData = try {
                              ttsEngine.synthesizeSceneToWav(scene.narration, wavFile, rmsThreshold)
                          } catch (e: Exception) {
                              failAt("Falha na síntese de voz", "Cena $sceneNum: ${e.localizedMessage}")
                              return
                          }

                          updatePhase("Analisando pausas da voz", progress + 2)
                          sceneAudioList.add(audioData.copy(sceneNumber = sceneNum))
                      }

                      val fullAudioWav = File(tempRoot, "full_narration.wav")
                      SimpleMp4Muxer.concatenateWavs(sceneAudioList.map { it.wavFile }, fullAudioWav)

                      val frameRenderer = FrameRenderer(applicationContext)
                      var globalFrameIndex = 1

                      val allStates = MouthState.values()
                      val closedState = allStates.firstOrNull { it.name.contains("CLOSE", true) } ?: MouthState.CLOSED
                      val openState = allStates.firstOrNull { it.name.contains("OPEN", true) } ?: allStates.first()
                      val oState = allStates.firstOrNull { it != closedState && it != openState } ?: openState

                      for ((index, scene) in script.scenes.withIndex()) {
                          currentCoroutineContext().ensureActive()
                          val sceneNum = index + 1
                          val audioData = sceneAudioList[index]
                          val sceneFramesCount = audioData.mouthTimeline4Fps.size.coerceAtLeast(1)

                          val progress = 40 + ((index.toFloat() / totalScenes) * 35).toInt()
                          updatePhase("Renderizando avatar e legendas cena $sceneNum de $totalScenes", progress)

                          var prevRenderedMouth = closedState
                          for (f in 0 until sceneFramesCount) {
                              currentCoroutineContext().ensureActive()
                              val localTime = f * 0.25
                              val rawMouth: MouthState = audioData.mouthTimeline4Fps.getOrElse(f) { closedState }

                              // Intercala dinamicamente as formas da boca durante a fala para nunca ficar travado com a boca aberta
                              val mouthState: MouthState = if (rawMouth == closedState) {
                                  closedState
                              } else {
                                  val candidate = when ((f + index) % 4) {
                                      0 -> openState
                                      1 -> closedState
                                      2 -> oState
                                      else -> openState
                                  }
                                  if (candidate == prevRenderedMouth && candidate != closedState) {
                                      if (f % 2 == 0) closedState else oState
                                  } else {
                                      candidate
                                  }
                              }
                              prevRenderedMouth = mouthState

                              val frameFile = File(framesDir, String.format("frame_%06d.jpg", globalFrameIndex++))

                              try {
                                  frameRenderer.renderAndSaveFrame(
                                      videoTitle = script.videoTitle,
                                      scene = scene,
                                      localTime = localTime,
                                      sceneDuration = audioData.durationSeconds,
                                      mouthState = mouthState,
                                      aspect = aspect,
                                      outputFile = frameFile
                                  )
                              } catch (e: Exception) {
                                  failAt("Falha ao criar frames", "Erro na cena $sceneNum: ${e.localizedMessage}")
                                  return
                              }
                          }
                      }

                      updatePhase("Codificando vídeo", 80)
                      val finalTempMp4 = File(tempRoot, "jornalforge_final.mp4")
                      updatePhase("Adicionando áudio", 86)

                      SimpleMp4Muxer.mux(framesDir, fullAudioWav, finalTempMp4, aspect.width, aspect.height)
                      if (!finalTempMp4.exists() || finalTempMp4.length() == 0L) {
                          failAt("Falha no codificador MP4", "Erro na codificação H.264/AAC.")
                          return
                      }

                      updatePhase("Salvando na galeria", 94)
                      val savedUri = saveMp4ToGallery(finalTempMp4, script.videoTitle)
                      if (savedUri == null) {
                          failAt("Falha ao salvar na galeria", "Não foi possível gravar o arquivo MP4 no MediaStore.")
                          return
                      }

                      updatePhase("Limpeza dos arquivos temporários", 98)
                      cleanupTempDir()

                      updatePhase("Vídeo finalizado", 100)
                      _statusFlow.value = ExportStatus.Completed(savedUri, "Movies/JornalForge")
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()

                  } catch (e: CancellationException) {
                      cleanupTempDir()
                  } catch (e: Exception) {
                      failAt("Falha inesperada", e.localizedMessage ?: "Erro desconhecido")
                  }
              }

              private fun saveMp4ToGallery(sourceMp4: File, title: String): Uri? {
                  return try {
                      val cleanTitle = title.replace(Regex("[^a-zA-Z0-9_-]"), "_").take(40)
                      val fileName = "JornalForge_${cleanTitle}_${System.currentTimeMillis()}.mp4"
                      val values = ContentValues().apply {
                          put(MediaStore.Video.Media.DISPLAY_NAME, fileName)
                          put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                          put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/JornalForge")
                          put(MediaStore.Video.Media.IS_PENDING, 1)
                      }

                      val resolver = applicationContext.contentResolver
                      val collection = MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      val itemUri = resolver.insert(collection, values) ?: return null

                      resolver.openOutputStream(itemUri)?.use { outStream ->
                          FileInputStream(sourceMp4).use { inStream ->
                              inStream.copyTo(outStream)
                          }
                      }

                      values.clear()
                      values.put(MediaStore.Video.Media.IS_PENDING, 0)
                      resolver.update(itemUri, values, null, null)
                      itemUri
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun cleanupTempDir() {
                  try {
                      val tempRoot = File(cacheDir, "jornalforge_job")
                      if (tempRoot.exists()) tempRoot.deleteRecursively()
                  } catch (_: Exception) {}
              }

              private fun updatePhase(phase: String, percent: Int) {
                  _statusFlow.value = ExportStatus.Running(phase, percent)
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(NOTIF_ID, buildNotification(phase, percent))
              }

              private fun failAt(exactPhase: String, details: String) {
                  cleanupTempDir()
                  _statusFlow.value = ExportStatus.Failed(exactPhase, details)
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun buildNotification(phase: String, percent: Int): Notification {
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("JornalForge • Produção de Vídeo")
                      .setContentText("$phase ($percent%)")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setOngoing(true)
                      .setProgress(100, percent, false)
                      .build()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Exportação JornalForge",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(channel)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
