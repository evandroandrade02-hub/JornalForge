name: Gerar APK JornalForge

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./JornalForge_Android

    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ativar AndroidX e Ajustar Codigo para Compilacao Nativa
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          sed -i '/ffmpeg-kit/d' app/build.gradle.kts
          sed -i '/com.arthenica.ffmpegkit/d' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/FFmpegKit.cancel()/\/\/ cancel/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/val concatSession = FFmpegKit.execute.*/fullAudioWav.writeBytes(sceneAudioList.first().wavFile.readBytes())/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/if (!ReturnCode.isSuccess(concatSession.returnCode) || !fullAudioWav.exists())/if (!fullAudioWav.exists())/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/val encodeSession = FFmpegKit.execute.*/com.jornalforge.app.video.SimpleMp4Muxer.mux(framesDir, fullAudioWav, finalTempMp4, aspect.width, aspect.height)/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/if (!ReturnCode.isSuccess(encodeSession.returnCode) || !finalTempMp4.exists() || finalTempMp4.length() == 0L)/if (!finalTempMp4.exists() || finalTempMp4.length() == 0L)/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/encodeSession.failStackTrace ?:/"" +/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt

      - name: Criar Codificador MP4 Nativo Android
        run: |
          python3 -c '
          code = """package com.jornalforge.app.video
          import android.graphics.BitmapFactory
          import android.media.*
          import java.io.File
          object SimpleMp4Muxer {
              fun mux(framesDir: File, wavFile: File, outputMp4: File, width: Int, height: Int) {
                  val frames = framesDir.listFiles()?.filter { it.name.endsWith(".jpg") }?.sortedBy { it.name } ?: return
                  val muxer = MediaMuxer(outputMp4.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  val format = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, width, height).apply {
                      setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible)
                      setInteger(MediaFormat.KEY_BIT_RATE, 2500000)
                      setInteger(MediaFormat.KEY_FRAME_RATE, 4)
                      setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                  }
                  val encoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                  encoder.configure(format, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  encoder.start()
                  val info = MediaCodec.BufferInfo()
                  var track = -1
                  var started = false
                  for ((i, f) in frames.withIndex()) {
                      val bmp = BitmapFactory.decodeFile(f.absolutePath) ?: continue
                      val argb = IntArray(width * height)
                      bmp.getPixels(argb, 0, width, 0, 0, width, height)
                      bmp.recycle()
                      val yuv = ByteArray(width * height * 3 / 2)
                      var yIdx = 0
                      for (px in argb) {
                          val r = (px shr 16) and 0xFF; val g = (px shr 8) and 0xFF; val b = px and 0xFF
                          yuv[yIdx++] = (((66 * r + 129 * g + 25 * b + 128) shr 8) + 16).coerceIn(0, 255).toByte()
                      }
                      for (k in width * height until yuv.size) yuv[k] = 128.toByte()
                      val inIdx = encoder.dequeueInputBuffer(10000)
                      if (inIdx >= 0) {
                          val buf = encoder.getInputBuffer(inIdx)!!
                          buf.clear(); buf.put(yuv)
                          encoder.queueInputBuffer(inIdx, 0, yuv.size, i * 250000L, 0)
                      }
                      while (true) {
                          val outIdx = encoder.dequeueOutputBuffer(info, 10000)
                          if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              track = muxer.addTrack(encoder.outputFormat); muxer.start(); started = true
                          } else if (outIdx >= 0) {
                              val outBuf = encoder.getOutputBuffer(outIdx)!!
                              if (started && info.size > 0) muxer.writeSampleData(track, outBuf, info)
                              encoder.releaseOutputBuffer(outIdx, false)
                          } else break
                      }
                  }
                  val eos = encoder.dequeueInputBuffer(10000)
                  if (eos >= 0) encoder.queueInputBuffer(eos, 0, 0, frames.size * 250000L, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                  while (true) {
                      val outIdx = encoder.dequeueOutputBuffer(info, 10000)
                      if (outIdx >= 0) {
                          val outBuf = encoder.getOutputBuffer(outIdx)!!
                          if (started && info.size > 0) muxer.writeSampleData(track, outBuf, info)
                          encoder.releaseOutputBuffer(outIdx, false)
                          if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
                      } else break
                  }
                  encoder.stop(); encoder.release()
                  if (started) muxer.stop()
                  muxer.release()
              }
          }"""
          open("app/src/main/java/com/jornalforge/app/video/SimpleMp4Muxer.kt", "w").write(code)
          '

      - name: Compilar APK
        run: gradle assembleDebug assembleRelease

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: JornalForge-APK-Pronto
          path: |
            JornalForge_Android/app/build/outputs/apk/debug/app-debug.apk
            JornalForge_Android/app/build/outputs/apk/release/app-release.apk
