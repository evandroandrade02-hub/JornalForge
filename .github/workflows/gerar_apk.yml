name: Gerar APK JornalForge

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./JornalForge_Android

    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ajustar Manifesto e Dependencias
        run: |
          python3 -c '
          open("gradle.properties", "w").write("org.gradle.jvmargs=-Xmx4096m\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n")
          m = "app/src/main/AndroidManifest.xml"
          txt = open(m).read()
          txt = txt.replace("FOREGROUND_SERVICE_MEDIA_PROCESSING", "FOREGROUND_SERVICE_DATA_SYNC")
          txt = txt.replace("mediaProcessing", "dataSync")
          open(m, "w").write(txt)
          b = "app/build.gradle.kts"
          lines = [l for l in open(b) if "ffmpeg-kit" not in l]
          open(b, "w").writelines(lines)
          '

      - name: Ajustar Servico de Video Nativo
        run: |
          python3 -c '
          s = "app/src/main/java/com/jornalforge/app/service/VideoExportService.kt"
          t = open(s).read()
          t = t.replace("import com.arthenica.ffmpegkit.FFmpegKit", "")
          t = t.replace("import com.arthenica.ffmpegkit.ReturnCode", "")
          t = t.replace("FFmpegKit.cancel()", "")
          t = t.replace("val concatSession = FFmpegKit.execute(\"-y -f concat -safe 0 -i \\\"${concatListFile.absolutePath}\\\" -c copy \\\"${fullAudioWav.absolutePath}\\\"\")", "fullAudioWav.writeBytes(sceneAudioList.first().wavFile.readBytes())")
          t = t.replace("!ReturnCode.isSuccess(concatSession.returnCode) || !fullAudioWav.exists()", "!fullAudioWav.exists()")
          t = t.replace("val encodeSession = FFmpegKit.execute(ffmpegCmd)", "com.jornalforge.app.video.SimpleMp4Muxer.mux(framesDir, fullAudioWav, finalTempMp4, aspect.width, aspect.height)")
          t = t.replace("!ReturnCode.isSuccess(encodeSession.returnCode) || !finalTempMp4.exists() || finalTempMp4.length() == 0L", "!finalTempMp4.exists() || finalTempMp4.length() == 0L")
          t = t.replace("encodeSession.failStackTrace ?:", "")
          open(s, "w").write(t)
          '

      - name: Criar Codificador MP4 Nativo
        run: |
          echo "" | base64 -d > app/src/main/java/com/jornalforge/app/video/SimpleMp4Muxer.kt

      - name: Compilar APK
        run: gradle assembleDebug assembleRelease

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: JornalForge-APK-Pronto
          path: |
            JornalForge_Android/app/build/outputs/apk/debug/app-debug.apk
            JornalForge_Android/app/build/outputs/apk/release/app-release.apk
