name: Gerar APK JornalForge

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./JornalForge_Android

    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ajustar Manifesto, Dependencias e FrameRenderer (Texto +15% com Margem)
        run: |
          python3 -c '
          import re, os

          open("gradle.properties", "w").write("org.gradle.jvmargs=-Xmx4096m\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n")

          m = "app/src/main/AndroidManifest.xml"
          txt = open(m).read()
          txt = txt.replace("FOREGROUND_SERVICE_MEDIA_PROCESSING", "FOREGROUND_SERVICE_DATA_SYNC")
          txt = txt.replace("mediaProcessing", "dataSync")
          open(m, "w").write(txt)

          b = "app/build.gradle.kts"
          lines = [l for l in open(b) if "ffmpeg-kit" not in l]
          open(b, "w").writelines(lines)

          # Ajustar FrameRenderer.kt: remover tint azulado e aumentar texto em ~14% com margem de seguranca
          fr_path = "app/src/main/java/com/jornalforge/app/video/FrameRenderer.kt"
          if os.path.exists(fr_path):
              fr = open(fr_path).read()

              # 1. Remover qualquer ColorFilter/tint que deixe texto ou avatar azulado
              fr = re.sub(r"\.colorFilter\s*=\s*[^\n]+", "", fr)

              # 2. Aumentar textSize em 14% (mais de 10% maior) mantendo proporcao
              def boost_font(match):
                  prefix = match.group(1)
                  val = float(match.group(2))
                  new_val = round(val * 1.14, 1)
                  return f"{prefix}{new_val}f"

              fr = re.sub(r"(textSize\s*=\s*)(\d+(?:\.\d+)?)f", boost_font, fr)

              # 3. Aumentar margem de seguranca e ajustar quebra de linha para nao sair do quadrante
              def shrink_line_chars(match):
                  prefix = match.group(1)
                  val = int(match.group(2))
                  # Reduz ~14% a largura maxima de caracteres por linha para compensar a fonte maior com folga
                  new_val = max(16, int(val * 0.85))
                  return f"{prefix}{new_val}"

              fr = re.sub(r"(maxCharsPerLine\s*=\s*|wrapText\([^,]+,\s*)(\d+)", shrink_line_chars, fr)

              open(fr_path, "w").write(fr)
          '

      - name: Atualizar MainActivity Service e Muxer com Correcao de Cores YUV e Audio AAC
        run: |
          echo "" | base64 -d > app/src/main/java/com/jornalforge/app/MainActivity.kt
          echo "" | base64 -d > app/src/main/java/com/jornalforge/app/service/VideoExportService.kt

          # Atualizar SimpleMp4Muxer.kt usando Image/InputImage da API nativa do MediaCodec para NUNCA inverter R/B (sem efeito azulado)
          cat << 'EOF' > app/src/main/java/com/jornalforge/app/video/SimpleMp4Muxer.kt
          package com.jornalforge.app.video

          import android.graphics.BitmapFactory
          import android.media.*
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          object SimpleMp4Muxer {

              fun concatenateWavs(wavFiles: List<File>, outWav: File) {
                  if (wavFiles.isEmpty()) return
                  val firstHeader = ByteArray(44)
                  FileInputStream(wavFiles.first()).use { it.read(firstHeader) }

                  var totalDataLen = 0L
                  for (f in wavFiles) {
                      if (f.exists() && f.length() > 44) {
                          totalDataLen += (f.length() - 44)
                      }
                  }

                  val headerBuf = ByteBuffer.wrap(firstHeader).order(ByteOrder.LITTLE_ENDIAN)
                  headerBuf.putInt(4, (36 + totalDataLen).toInt())
                  headerBuf.putInt(40, totalDataLen.toInt())

                  FileOutputStream(outWav).use { fos ->
                      fos.write(firstHeader)
                      val buf = ByteArray(16384)
                      for (wav in wavFiles) {
                          if (!wav.exists() || wav.length() <= 44) continue
                          FileInputStream(wav).use { fis ->
                              fis.skip(44)
                              var read: Int
                              while (fis.read(buf).also { read = it } != -1) {
                                  fos.write(buf, 0, read)
                              }
                          }
                      }
                  }
              }

              fun mux(framesDir: File, wavFile: File, outputMp4: File, width: Int, height: Int) {
                  val frames = framesDir.listFiles()?.filter { it.name.endsWith(".jpg") }?.sortedBy { it.name } ?: return
                  if (frames.isEmpty()) return

                  var sampleRate = 22050
                  var channels = 1
                  if (wavFile.exists() && wavFile.length() > 44) {
                      val header = ByteArray(44)
                      FileInputStream(wavFile).use { it.read(header) }
                      val hb = ByteBuffer.wrap(header).order(ByteOrder.LITTLE_ENDIAN)
                      channels = hb.getShort(22).toInt().coerceIn(1, 2)
                      sampleRate = hb.getInt(24).coerceIn(8000, 48000)
                  }

                  val muxer = MediaMuxer(outputMp4.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)

                  val videoFormat = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, width, height).apply {
                      setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible)
                      setInteger(MediaFormat.KEY_BIT_RATE, 2_500_000)
                      setInteger(MediaFormat.KEY_FRAME_RATE, 4)
                      setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                  }
                  val videoEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                  videoEncoder.configure(videoFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  videoEncoder.start()

                  val channelMask = if (channels == 2) AudioFormat.CHANNEL_IN_STEREO else AudioFormat.CHANNEL_IN_MONO
                  val audioFormat = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, sampleRate, channels).apply {
                      setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)
                      setInteger(MediaFormat.KEY_BIT_RATE, 192_000)
                      setInteger(MediaFormat.KEY_CHANNEL_MASK, channelMask)
                      setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384)
                  }
                  val audioEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC)
                  audioEncoder.configure(audioFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  audioEncoder.start()

                  class EncodedPacket(val data: ByteArray, val ptsUs: Long, val flags: Int)
                  val videoPackets = mutableListOf<EncodedPacket>()
                  val audioPackets = mutableListOf<EncodedPacket>()

                  var outVideoFormat: MediaFormat? = null
                  var outAudioFormat: MediaFormat? = null
                  val vInfo = MediaCodec.BufferInfo()
                  val aInfo = MediaCodec.BufferInfo()

                  for ((i, f) in frames.withIndex()) {
                      val bmp = BitmapFactory.decodeFile(f.absolutePath) ?: continue
                      val inIdx = videoEncoder.dequeueInputBuffer(10_000)
                      if (inIdx >= 0) {
                          val img = videoEncoder.getInputImage(inIdx)
                          if (img != null) {
                              fillYuv420ImageFromBitmap(img, bmp, width, height)
                              videoEncoder.queueInputBuffer(inIdx, 0, width * height * 3 / 2, i * 250_000L, 0)
                          } else {
                              val yuv = bitmapToNv12(bmp, width, height)
                              val buf = videoEncoder.getInputBuffer(inIdx)!!
                              buf.clear()
                              buf.put(yuv)
                              videoEncoder.queueInputBuffer(inIdx, 0, yuv.size, i * 250_000L, 0)
                          }
                      }
                      bmp.recycle()

                      while (true) {
                          val outIdx = videoEncoder.dequeueOutputBuffer(vInfo, 10_000)
                          if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              outVideoFormat = videoEncoder.outputFormat
                          } else if (outIdx >= 0) {
                              val outBuf = videoEncoder.getOutputBuffer(outIdx)!!
                              if ((vInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && vInfo.size > 0) {
                                  val bytes = ByteArray(vInfo.size)
                                  outBuf.position(vInfo.offset)
                                  outBuf.limit(vInfo.offset + vInfo.size)
                                  outBuf.get(bytes)
                                  videoPackets.add(EncodedPacket(bytes, vInfo.presentationTimeUs, vInfo.flags))
                              }
                              videoEncoder.releaseOutputBuffer(outIdx, false)
                          } else break
                      }
                  }

                  val vEos = videoEncoder.dequeueInputBuffer(10_000)
                  if (vEos >= 0) {
                      videoEncoder.queueInputBuffer(vEos, 0, 0, frames.size * 250_000L, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                  }
                  while (true) {
                      val outIdx = videoEncoder.dequeueOutputBuffer(vInfo, 10_000)
                      if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          outVideoFormat = videoEncoder.outputFormat
                      } else if (outIdx >= 0) {
                          val outBuf = videoEncoder.getOutputBuffer(outIdx)!!
                          if ((vInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && vInfo.size > 0) {
                              val bytes = ByteArray(vInfo.size)
                              outBuf.position(vInfo.offset)
                              outBuf.limit(vInfo.offset + vInfo.size)
                              outBuf.get(bytes)
                              videoPackets.add(EncodedPacket(bytes, vInfo.presentationTimeUs, vInfo.flags))
                          }
                          videoEncoder.releaseOutputBuffer(outIdx, false)
                          if ((vInfo.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
                      } else break
                  }
                  videoEncoder.stop()
                  videoEncoder.release()

                  if (wavFile.exists() && wavFile.length() > 44) {
                      val bytesPerSecond = (sampleRate * channels * 2).toDouble()
                      FileInputStream(wavFile).use { fis ->
                          fis.skip(44)
                          val readBuf = ByteArray(4096)
                          var totalReadBytes = 0L
                          var audioInputDone = false

                          while (!audioInputDone) {
                              val inIdx = audioEncoder.dequeueInputBuffer(10_000)
                              if (inIdx >= 0) {
                                  val inBuf = audioEncoder.getInputBuffer(inIdx)!!
                                  inBuf.clear()
                                  val read = fis.read(readBuf, 0, minOf(readBuf.size, inBuf.remaining()))
                                  val ptsUs = ((totalReadBytes / bytesPerSecond) * 1_000_000.0).toLong()
                                  if (read <= 0) {
                                      audioEncoder.queueInputBuffer(inIdx, 0, 0, ptsUs, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                      audioInputDone = true
                                  } else {
                                      inBuf.put(readBuf, 0, read)
                                      audioEncoder.queueInputBuffer(inIdx, 0, read, ptsUs, 0)
                                      totalReadBytes += read
                                  }
                              }
                              while (true) {
                                  val outIdx = audioEncoder.dequeueOutputBuffer(aInfo, 10_000)
                                  if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                      outAudioFormat = audioEncoder.outputFormat
                                  } else if (outIdx >= 0) {
                                      val outBuf = audioEncoder.getOutputBuffer(outIdx)!!
                                      if ((aInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && aInfo.size > 0) {
                                          val bytes = ByteArray(aInfo.size)
                                          outBuf.position(aInfo.offset)
                                          outBuf.limit(aInfo.offset + aInfo.size)
                                          outBuf.get(bytes)
                                          audioPackets.add(EncodedPacket(bytes, aInfo.presentationTimeUs, aInfo.flags))
                                      }
                                      audioEncoder.releaseOutputBuffer(outIdx, false)
                                  } else break
                              }
                          }

                          while (true) {
                              val outIdx = audioEncoder.dequeueOutputBuffer(aInfo, 10_000)
                              if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                  outAudioFormat = audioEncoder.outputFormat
                              } else if (outIdx >= 0) {
                                  val outBuf = audioEncoder.getOutputBuffer(outIdx)!!
                                  if ((aInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && aInfo.size > 0) {
                                      val bytes = ByteArray(aInfo.size)
                                      outBuf.position(aInfo.offset)
                                      outBuf.limit(aInfo.offset + aInfo.size)
                                      outBuf.get(bytes)
                                      audioPackets.add(EncodedPacket(bytes, aInfo.presentationTimeUs, aInfo.flags))
                                  }
                                  audioEncoder.releaseOutputBuffer(outIdx, false)
                                  if ((aInfo.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
                              } else break
                          }
                      }
                  }
                  audioEncoder.stop()
                  audioEncoder.release()

                  val vTrack = outVideoFormat?.let { muxer.addTrack(it) } ?: -1
                  val aTrack = outAudioFormat?.let { muxer.addTrack(it) } ?: -1

                  if (vTrack >= 0) {
                      muxer.start()
                      val writeInfo = MediaCodec.BufferInfo()
                      for (pkt in videoPackets) {
                          val bb = ByteBuffer.wrap(pkt.data)
                          writeInfo.set(0, pkt.data.size, pkt.ptsUs, pkt.flags)
                          muxer.writeSampleData(vTrack, bb, writeInfo)
                      }
                      if (aTrack >= 0) {
                          for (pkt in audioPackets) {
                              val bb = ByteBuffer.wrap(pkt.data)
                              writeInfo.set(0, pkt.data.size, pkt.ptsUs, pkt.flags)
                              muxer.writeSampleData(aTrack, bb, writeInfo)
                          }
                      }
                      muxer.stop()
                  }
                  muxer.release()
              }

              // Preenche os planos Y, U (Cb) e V (Cr) respeitando exatamente o pixelStride e rowStride de cada hardware Android
              private fun fillYuv420ImageFromBitmap(img: Image, bmp: android.graphics.Bitmap, width: Int, height: Int) {
                  val argb = IntArray(width * height)
                  bmp.getPixels(argb, 0, width, 0, 0, width, height)

                  val yPlane = img.planes[0]
                  val uPlane = img.planes[1]
                  val vPlane = img.planes[2]

                  val yBuf = yPlane.buffer
                  val uBuf = uPlane.buffer
                  val vBuf = vPlane.buffer

                  val yRowStride = yPlane.rowStride
                  val yPixStride = yPlane.pixelStride
                  val uRowStride = uPlane.rowStride
                  val uPixStride = uPlane.pixelStride
                  val vRowStride = vPlane.rowStride
                  val vPixStride = vPlane.pixelStride

                  for (j in 0 until height) {
                      for (i in 0 until width) {
                          val c = argb[j * width + i]
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF

                          val y = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          yBuf.put(j * yRowStride + i * yPixStride, y.coerceIn(0, 255).toByte())

                          if (j % 2 == 0 && i % 2 == 0) {
                              val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                              val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                              val uvRow = j / 2
                              val uvCol = i / 2
                              uBuf.put(uvRow * uRowStride + uvCol * uPixStride, u.coerceIn(0, 255).toByte())
                              vBuf.put(uvRow * vRowStride + uvCol * vPixStride, v.coerceIn(0, 255).toByte())
                          }
                      }
                  }
              }

              private fun bitmapToNv12(bmp: android.graphics.Bitmap, width: Int, height: Int): ByteArray {
                  val argb = IntArray(width * height)
                  bmp.getPixels(argb, 0, width, 0, 0, width, height)
                  val yuv = ByteArray(width * height * 3 / 2)
                  var yIndex = 0
                  var uvIndex = width * height
                  for (j in 0 until height) {
                      for (i in 0 until width) {
                          val c = argb[j * width + i]
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF
                          val y = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                          val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                          yuv[yIndex++] = y.coerceIn(0, 255).toByte()
                          if (j % 2 == 0 && i % 2 == 0 && uvIndex + 1 < yuv.size) {
                              yuv[uvIndex++] = u.coerceIn(0, 255).toByte()
                              yuv[uvIndex++] = v.coerceIn(0, 255).toByte()
                          }
                      }
                  }
                  return yuv
              }
          }
          EOF

      - name: Gerar e Substituir Avatar 3D com Tons de Pele Quentes Naturais (Closed, Open, O)
        run: |
          pip install pillow
          python3 -c '
          import glob, os
          from PIL import Image, ImageDraw, ImageFilter

          res_dir = "app/src/main/res/drawable"
          for name in ["reporter_closed", "reporter_open", "reporter_o"]:
              for f in glob.glob(os.path.join(res_dir, f"{name}.*")):
                  os.remove(f)

          def render_avatar(mouth_mode, out_path):
              W, H = 600, 600
              img = Image.new("RGBA", (W, H), (255, 255, 255, 255))
              draw = ImageDraw.Draw(img)

              # Sombra suave neutra no fundo branco puro (sem tom azul)
              shadow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              sdraw = ImageDraw.Draw(shadow)
              sdraw.ellipse([135, 85, 465, 555], fill=(235, 232, 228, 255))
              shadow = shadow.filter(ImageFilter.GaussianBlur(26))
              img = Image.alpha_composite(img, shadow)
              draw = ImageDraw.Draw(img)

              # Terno executivo preto neutro (sem subtom azulado)
              draw.polygon([(50, 600), (140, 445), (245, 420), (355, 420), (460, 445), (550, 600)], fill=(22, 22, 22))
              draw.polygon([(80, 600), (155, 455), (250, 430), (350, 430), (445, 455), (520, 600)], fill=(30, 30, 30))

              # Camisa social branca pura
              draw.polygon([(235, 420), (365, 420), (325, 585), (275, 585)], fill=(250, 250, 250))
              # Colarinho
              draw.polygon([(235, 415), (288, 468), (250, 495), (218, 435)], fill=(255, 255, 255), outline=(222, 220, 218))
              draw.polygon([(365, 415), (312, 468), (350, 495), (382, 435)], fill=(255, 255, 255), outline=(222, 220, 218))

              # Gravata social preta
              draw.polygon([(284, 462), (316, 462), (322, 495), (278, 495)], fill=(18, 18, 18))
              draw.polygon([(282, 495), (318, 495), (328, 600), (272, 600)], fill=(25, 25, 25))

              # Lapelas do terno
              draw.polygon([(218, 430), (276, 585), (225, 600), (175, 470)], fill=(38, 38, 38))
              draw.polygon([(382, 430), (324, 585), (375, 600), (425, 470)], fill=(38, 38, 38))

              # Pescoco masculino forte com tom moreno claro quente
              draw.rectangle([246, 345, 354, 450], fill=(208, 154, 118))
              neck_sh = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              nsdraw = ImageDraw.Draw(neck_sh)
              nsdraw.ellipse([242, 335, 358, 415], fill=(148, 98, 68, 155))
              neck_sh = neck_sh.filter(ImageFilter.GaussianBlur(12))
              img = Image.alpha_composite(img, neck_sh)
              draw = ImageDraw.Draw(img)

              # Orelhas
              draw.ellipse([166, 228, 198, 298], fill=(210, 156, 120), outline=(170, 118, 86), width=2)
              draw.ellipse([402, 228, 434, 298], fill=(210, 156, 120), outline=(170, 118, 86), width=2)

              # Rosto masculino forte e mandibula angular marcada (tom de pele quente natural)
              face_pts = [
                  (184, 175), (186, 265), (202, 335),
                  (256, 386), (300, 394), (344, 386),
                  (398, 335), (414, 265), (416, 175),
                  (375, 118), (300, 108), (225, 118)
              ]
              draw.polygon(face_pts, fill=(224, 172, 136))

              # Iluminacao 3D nas bochechas, testa e mandibula
              shade = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              sh_draw = ImageDraw.Draw(shade)
              sh_draw.ellipse([215, 125, 385, 220], fill=(248, 208, 176, 115))
              sh_draw.ellipse([200, 230, 275, 300], fill=(244, 200, 168, 85))
              sh_draw.ellipse([325, 230, 400, 300], fill=(244, 200, 168, 85))
              sh_draw.polygon([(184, 250), (202, 335), (245, 378), (225, 260)], fill=(168, 116, 84, 120))
              sh_draw.polygon([(416, 250), (398, 335), (355, 378), (375, 260)], fill=(168, 116, 84, 120))
              shade = shade.filter(ImageFilter.GaussianBlur(14))
              img = Image.alpha_composite(img, shade)

              # Barba curta por fazer (castanho escuro quente, sem cinza/azul)
              beard = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              bdraw = ImageDraw.Draw(beard)
              beard_pts = [
                  (188, 258), (202, 335), (256, 386), (300, 394),
                  (344, 386), (398, 335), (412, 258),
                  (388, 296), (348, 314), (300, 310), (252, 314), (212, 296)
              ]
              bdraw.polygon(beard_pts, fill=(54, 36, 26, 120))
              bdraw.polygon([(252, 312), (300, 304), (348, 312), (356, 332), (300, 326), (244, 332)], fill=(48, 32, 22, 150))
              bdraw.rectangle([290, 342, 310, 382], fill=(48, 32, 22, 125))
              beard = beard.filter(ImageFilter.GaussianBlur(4))
              img = Image.alpha_composite(img, beard)
              draw = ImageDraw.Draw(img)

              # Nariz masculino definido
              draw.polygon([(300, 222), (283, 292), (300, 301), (317, 292)], fill=(204, 150, 114))
              draw.line([(298, 224), (298, 290)], fill=(242, 200, 170), width=4)
              draw.ellipse([282, 290, 294, 298], fill=(142, 94, 66))
              draw.ellipse([306, 290, 318, 298], fill=(142, 94, 66))

              # Olhos castanho escuro
              for cx in [248, 352]:
                  draw.polygon([(cx-26, 232), (cx-10, 222), (cx+12, 222), (cx+26, 232), (cx+12, 241), (cx-12, 241)], fill=(250, 248, 246))
                  draw.ellipse([cx-11, 221, cx+11, 241], fill=(68, 40, 22))
                  draw.ellipse([cx-5, 226, cx+5, 236], fill=(16, 10, 8))
                  draw.ellipse([cx-7, 224, cx-2, 229], fill=(255, 255, 255))
                  draw.line([(cx-27, 231), (cx-10, 221), (cx+12, 221), (cx+27, 231)], fill=(34, 22, 14), width=3)

              # Sobrancelhas grossas castanho escuro
              draw.polygon([(214, 212), (235, 202), (278, 210), (275, 219), (236, 212)], fill=(44, 28, 18))
              draw.polygon([(386, 212), (365, 202), (322, 210), (325, 219), (364, 212)], fill=(44, 28, 18))

              # Cabelo castanho escuro volumoso, ondulado
              hair_pts = [
                  (178, 235), (168, 175), (185, 118), (232, 76),
                  (300, 64), (368, 76), (415, 118), (432, 175),
                  (422, 235), (406, 182), (382, 144), (336, 132),
                  (300, 138), (264, 132), (218, 144), (194, 182)
              ]
              draw.polygon(hair_pts, fill=(42, 26, 16))
              draw.chord([195, 58, 330, 148], 0, 360, fill=(50, 32, 20))
              draw.chord([270, 54, 405, 145], 0, 360, fill=(38, 24, 15))
              draw.arc([210, 72, 385, 140], 185, 355, fill=(74, 48, 32), width=4)
              draw.arc([230, 86, 365, 150], 185, 355, fill=(66, 42, 28), width=3)

              # Variacoes apenas na expressao bucal
              if mouth_mode == "closed":
                  draw.polygon([(266, 334), (288, 329), (300, 332), (312, 329), (334, 334), (300, 336)], fill=(176, 106, 92))
                  draw.polygon([(268, 335), (332, 335), (316, 344), (284, 344)], fill=(192, 120, 106))
                  draw.line([(265, 335), (300, 336), (335, 335)], fill=(104, 54, 46), width=2)
              elif mouth_mode == "open":
                  draw.polygon([(265, 331), (288, 326), (300, 329), (312, 326), (335, 331), (315, 348), (285, 348)], fill=(184, 112, 98))
                  draw.polygon([(274, 333), (326, 333), (316, 342), (284, 342)], fill=(62, 24, 24))
                  draw.line([(282, 334), (318, 334)], fill=(238, 234, 228), width=2)
              elif mouth_mode == "o":
                  draw.ellipse([281, 322, 319, 356], fill=(180, 108, 94))
                  draw.ellipse([287, 327, 313, 351], fill=(54, 20, 20))

              img.convert("RGB").save(out_path, "PNG")

          render_avatar("closed", os.path.join(res_dir, "reporter_closed.png"))
          render_avatar("open", os.path.join(res_dir, "reporter_open.png"))
          render_avatar("o", os.path.join(res_dir, "reporter_o.png"))
          '

      - name: Compilar APK
        run: gradle assembleDebug assembleRelease

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: JornalForge-APK-Pronto
          path: |
            JornalForge_Android/app/build/outputs/apk/debug/app-debug.apk
            JornalForge_Android/app/build/outputs/apk/release/app-release.apk
