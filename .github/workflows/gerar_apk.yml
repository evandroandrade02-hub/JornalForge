                                  color = Color(0xFFD92323)
                              )
                              Spacer(modifier = Modifier.height(6.dp))
                              Text("Fase atual: ${st.phase} (${st.progressPercent}%)", color = Color.White, fontSize = 13.sp)
                              TextButton(
                                  onClick = {
                                      val cancelIntent = Intent(context, VideoExportService::class.java).apply {
                                          action = VideoExportService.ACTION_CANCEL
                                      }
                                      context.startService(cancelIntent)
                                  }
                              ) {
                                  Text("Cancelar Exportação", color = Color(0xFFEF5350))
                              }
                          }
                          is ExportStatus.Completed -> {
                              Spacer(modifier = Modifier.height(12.dp))
                              Text("✅ Vídeo finalizado e salvo na Galeria (${st.displayPath})!", color = Color(0xFF66BB6A), fontWeight = FontWeight.Bold)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(onClick = {
                                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                                          type = "video/mp4"
                                          putExtra(Intent.EXTRA_STREAM, st.galleryUri)
                                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      }
                                      context.startActivity(Intent.createChooser(shareIntent, "Compartilhar Reportagem MP4"))
                                  }) {
                                      Text("Compartilhar MP4")
                                  }
                                  OutlinedButton(onClick = {
                                      val viewIntent = Intent(Intent.ACTION_VIEW).apply {
                                          setDataAndType(st.galleryUri, "video/mp4")
                                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      }
                                      context.startActivity(viewIntent)
                                  }) {
                                      Text("Abrir Vídeo")
                                  }
                              }
                          }
                          is ExportStatus.Failed -> {
                              Spacer(modifier = Modifier.height(12.dp))
                              Text("❌ Erro em [${st.exactPhase}]: ${st.details}", color = Color(0xFFEF5350), fontSize = 13.sp)
                          }
                          ExportStatus.Idle -> {}
                      }
                  }

                  StepCard(title = "ETAPA 4 • Voz Faber e Avatar Retro 32-bit / N64") {
                      val offlineReady = remember { PiperTtsEngine(context).isOfflineFaberModelInstalled() }
                      Text("• Voz Faber - Português Brasileiro (pt_BR-faber-medium.onnx)", color = Color.White, fontSize = 13.sp)
                      Text("• Motor Piper integrado | Velocidade 0.95 (Fala pausada e eloquente)", color = Color(0xFFB8C2D4), fontSize = 13.sp)
                      Text(
                          text = if (offlineReady) "• Status da Síntese: 100% Offline no Dispositivo (ONNX NDK)"
                                 else "• Status da Síntese: Arquitetura Híbrida Ativa",
                          color = Color(0xFF81C784),
                          fontSize = 12.sp
                      )
                      Text("• Estilo Visual: Retro 32-bit / N64 Low-Poly 3D (4 Expressões A, E, I, O)", color = Color(0xFFB8C2D4), fontSize = 13.sp)

                      Spacer(modifier = Modifier.height(8.dp))
                      Text("Limiar RMS de Pausa Vocal: ${rmsThreshold.toInt()} (Padrão: 520 PCM 16-bit)", color = Color.White, fontSize = 12.sp)
                      Slider(
                          value = rmsThreshold,
                          onValueChange = { rmsThreshold = it },
                          valueRange = 200f..1200f
                      )

                      Row(
                          horizontalArrangement = Arrangement.SpaceEvenly,
                          modifier = Modifier.fillMaxWidth().padding(top = 8.dp)
                      ) {
                          AvatarPreviewItem(R.drawable.reporter_a, "Fonema A")
                          AvatarPreviewItem(R.drawable.reporter_open, "Fonema E")
                          AvatarPreviewItem(R.drawable.reporter_closed, "Fonema I")
                          AvatarPreviewItem(R.drawable.reporter_o, "Fonema O")
                      }
                  }
              }
          }

          @Composable
          fun StepCard(title: String, content: @Composable ColumnScope.() -> Unit) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(Color(0xFF151A24), RoundedCornerShape(10.dp))
                      .border(1.dp, Color(0xFF263042), RoundedCornerShape(10.dp))
                      .padding(14.dp)
              ) {
                  Text(
                      text = title,
                      color = Color(0xFFD92323),
                      fontWeight = FontWeight.Bold,
                      fontSize = 14.sp
                  )
                  Spacer(modifier = Modifier.height(10.dp))
                  content()
              }
          }

          @Composable
          fun AvatarPreviewItem(resId: Int, label: String) {
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Image(
                      painter = painterResource(id = resId),
                      contentDescription = label,
                      modifier = Modifier
                          .size(72.dp)
                          .border(1.dp, Color(0xFF37474F), RoundedCornerShape(6.dp))
                  )
                  Spacer(modifier = Modifier.height(4.dp))
                  Text(label, color = Color(0xFFB0BEC5), fontSize = 11.sp)
              }
          }
          EOF

          echo "" | base64 -d > app/src/main/java/com/jornalforge/app/service/VideoExportService.kt

          cat << 'EOF' > app/src/main/java/com/jornalforge/app/video/SimpleMp4Muxer.kt
          package com.jornalforge.app.video

          import android.graphics.BitmapFactory
          import android.media.*
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          object SimpleMp4Muxer {

              fun concatenateWavs(wavFiles: List<File>, outWav: File) {
                  if (wavFiles.isEmpty()) return
                  val firstHeader = ByteArray(44)
                  FileInputStream(wavFiles.first()).use { it.read(firstHeader) }

                  var totalDataLen = 0L
                  for (f in wavFiles) {
                      if (f.exists() && f.length() > 44) {
                          totalDataLen += (f.length() - 44)
                      }
                  }

                  val headerBuf = ByteBuffer.wrap(firstHeader).order(ByteOrder.LITTLE_ENDIAN)
                  headerBuf.putInt(4, (36 + totalDataLen).toInt())
                  headerBuf.putInt(40, totalDataLen.toInt())

                  FileOutputStream(outWav).use { fos ->
                      fos.write(firstHeader)
                      val buf = ByteArray(16384)
                      for (wav in wavFiles) {
                          if (!wav.exists() || wav.length() <= 44) continue
                          FileInputStream(wav).use { fis ->
                              fis.skip(44)
                              var read: Int
                              while (fis.read(buf).also { read = it } != -1) {
                                  fos.write(buf, 0, read)
                              }
                          }
                      }
                  }
              }

              fun mux(framesDir: File, wavFile: File, outputMp4: File, width: Int, height: Int) {
                  val frames = framesDir.listFiles()?.filter { it.name.endsWith(".jpg") }?.sortedBy { it.name } ?: return
                  if (frames.isEmpty()) return

                  var sampleRate = 22050
                  var channels = 1
                  if (wavFile.exists() && wavFile.length() > 44) {
                      val header = ByteArray(44)
                      FileInputStream(wavFile).use { it.read(header) }
                      val hb = ByteBuffer.wrap(header).order(ByteOrder.LITTLE_ENDIAN)
                      channels = hb.getShort(22).toInt().coerceIn(1, 2)
                      sampleRate = hb.getInt(24).coerceIn(8000, 48000)
                  }

                  val muxer = MediaMuxer(outputMp4.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)

                  val videoFormat = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, width, height).apply {
                      setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible)
                      setInteger(MediaFormat.KEY_BIT_RATE, 2_500_000)
                      setInteger(MediaFormat.KEY_FRAME_RATE, 4)
                      setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                  }
                  val videoEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                  videoEncoder.configure(videoFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  videoEncoder.start()

                  val channelMask = if (channels == 2) AudioFormat.CHANNEL_IN_STEREO else AudioFormat.CHANNEL_IN_MONO
                  val audioFormat = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, sampleRate, channels).apply {
                      setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)
                      setInteger(MediaFormat.KEY_BIT_RATE, 192_000)
                      setInteger(MediaFormat.KEY_CHANNEL_MASK, channelMask)
                      setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384)
                  }
                  val audioEncoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC)
                  audioEncoder.configure(audioFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  audioEncoder.start()

                  class EncodedPacket(val data: ByteArray, val ptsUs: Long, val flags: Int)
                  val videoPackets = mutableListOf<EncodedPacket>()
                  val audioPackets = mutableListOf<EncodedPacket>()

                  var outVideoFormat: MediaFormat? = null
                  var outAudioFormat: MediaFormat? = null
                  val vInfo = MediaCodec.BufferInfo()
                  val aInfo = MediaCodec.BufferInfo()

                  for ((i, f) in frames.withIndex()) {
                      val bmp = BitmapFactory.decodeFile(f.absolutePath) ?: continue
                      val inIdx = videoEncoder.dequeueInputBuffer(10_000)
                      if (inIdx >= 0) {
                          val img = videoEncoder.getInputImage(inIdx)
                          if (img != null) {
                              fillYuv420ImageFromBitmap(img, bmp, width, height)
                              videoEncoder.queueInputBuffer(inIdx, 0, width * height * 3 / 2, i * 250_000L, 0)
                          } else {
                              val yuv = bitmapToNv12(bmp, width, height)
                              val buf = videoEncoder.getInputBuffer(inIdx)!!
                              buf.clear()
                              buf.put(yuv)
                              videoEncoder.queueInputBuffer(inIdx, 0, yuv.size, i * 250_000L, 0)
                          }
                      }
                      bmp.recycle()

                      while (true) {
                          val outIdx = videoEncoder.dequeueOutputBuffer(vInfo, 10_000)
                          if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              outVideoFormat = videoEncoder.outputFormat
                          } else if (outIdx >= 0) {
                              val outBuf = videoEncoder.getOutputBuffer(outIdx)!!
                              if ((vInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && vInfo.size > 0) {
                                  val bytes = ByteArray(vInfo.size)
                                  outBuf.position(vInfo.offset)
                                  outBuf.limit(vInfo.offset + vInfo.size)
                                  outBuf.get(bytes)
                                  videoPackets.add(EncodedPacket(bytes, vInfo.presentationTimeUs, vInfo.flags))
                              }
                              videoEncoder.releaseOutputBuffer(outIdx, false)
                          } else break
                      }
                  }

                  val vEos = videoEncoder.dequeueInputBuffer(10_000)
                  if (vEos >= 0) {
                      videoEncoder.queueInputBuffer(vEos, 0, 0, frames.size * 250_000L, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                  }
                  while (true) {
                      val outIdx = videoEncoder.dequeueOutputBuffer(vInfo, 10_000)
                      if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          outVideoFormat = videoEncoder.outputFormat
                      } else if (outIdx >= 0) {
                          val outBuf = videoEncoder.getOutputBuffer(outIdx)!!
                          if ((vInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && vInfo.size > 0) {
                              val bytes = ByteArray(vInfo.size)
                              outBuf.position(vInfo.offset)
                              outBuf.limit(vInfo.offset + vInfo.size)
                              outBuf.get(bytes)
                              videoPackets.add(EncodedPacket(bytes, vInfo.presentationTimeUs, vInfo.flags))
                          }
                          videoEncoder.releaseOutputBuffer(outIdx, false)
                          if ((vInfo.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
                      } else break
                  }
                  videoEncoder.stop()
                  videoEncoder.release()

                  if (wavFile.exists() && wavFile.length() > 44) {
                      val bytesPerSecond = (sampleRate * channels * 2).toDouble()
                      FileInputStream(wavFile).use { fis ->
                          fis.skip(44)
                          val readBuf = ByteArray(4096)
                          var totalReadBytes = 0L
                          var audioInputDone = false

                          while (!audioInputDone) {
                              val inIdx = audioEncoder.dequeueInputBuffer(10_000)
                              if (inIdx >= 0) {
                                  val inBuf = audioEncoder.getInputBuffer(inIdx)!!
                                  inBuf.clear()
                                  val read = fis.read(readBuf, 0, minOf(readBuf.size, inBuf.remaining()))
                                  val ptsUs = ((totalReadBytes / bytesPerSecond) * 1_000_000.0).toLong()
                                  if (read <= 0) {
                                      audioEncoder.queueInputBuffer(inIdx, 0, 0, ptsUs, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                      audioInputDone = true
                                  } else {
                                      inBuf.put(readBuf, 0, read)
                                      audioEncoder.queueInputBuffer(inIdx, 0, read, ptsUs, 0)
                                      totalReadBytes += read
                                  }
                              }
                              while (true) {
                                  val outIdx = audioEncoder.dequeueOutputBuffer(aInfo, 10_000)
                                  if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                      outAudioFormat = audioEncoder.outputFormat
                                  } else if (outIdx >= 0) {
                                      val outBuf = audioEncoder.getOutputBuffer(outIdx)!!
                                      if ((aInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && aInfo.size > 0) {
                                          val bytes = ByteArray(aInfo.size)
                                          outBuf.position(aInfo.offset)
                                          outBuf.limit(aInfo.offset + aInfo.size)
                                          outBuf.get(bytes)
                                          audioPackets.add(EncodedPacket(bytes, aInfo.presentationTimeUs, aInfo.flags))
                                      }
                                      audioEncoder.releaseOutputBuffer(outIdx, false)
                                  } else break
                              }
                          }

                          while (true) {
                              val outIdx = audioEncoder.dequeueOutputBuffer(aInfo, 10_000)
                              if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                  outAudioFormat = audioEncoder.outputFormat
                              } else if (outIdx >= 0) {
                                  val outBuf = audioEncoder.getOutputBuffer(outIdx)!!
                                  if ((aInfo.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && aInfo.size > 0) {
                                      val bytes = ByteArray(aInfo.size)
                                      outBuf.position(aInfo.offset)
                                      outBuf.limit(aInfo.offset + aInfo.size)
                                      outBuf.get(bytes)
                                      audioPackets.add(EncodedPacket(bytes, aInfo.presentationTimeUs, aInfo.flags))
                                  }
                                  audioEncoder.releaseOutputBuffer(outIdx, false)
                                  if ((aInfo.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
                              } else break
                          }
                      }
                  }
                  audioEncoder.stop()
                  audioEncoder.release()

                  val vTrack = outVideoFormat?.let { muxer.addTrack(it) } ?: -1
                  val aTrack = outAudioFormat?.let { muxer.addTrack(it) } ?: -1

                  if (vTrack >= 0) {
                      muxer.start()
                      val writeInfo = MediaCodec.BufferInfo()
                      for (pkt in videoPackets) {
                          val bb = ByteBuffer.wrap(pkt.data)
                          writeInfo.set(0, pkt.data.size, pkt.ptsUs, pkt.flags)
                          muxer.writeSampleData(vTrack, bb, writeInfo)
                      }
                      if (aTrack >= 0) {
                          for (pkt in audioPackets) {
                              val bb = ByteBuffer.wrap(pkt.data)
                              writeInfo.set(0, pkt.data.size, pkt.ptsUs, pkt.flags)
                              muxer.writeSampleData(aTrack, bb, writeInfo)
                          }
                      }
                      muxer.stop()
                  }
                  muxer.release()
              }

              private fun fillYuv420ImageFromBitmap(img: Image, bmp: android.graphics.Bitmap, width: Int, height: Int) {
                  val argb = IntArray(width * height)
                  bmp.getPixels(argb, 0, width, 0, 0, width, height)

                  val yPlane = img.planes[0]
                  val uPlane = img.planes[1]
                  val vPlane = img.planes[2]

                  val yBuf = yPlane.buffer
                  val uBuf = uPlane.buffer
                  val vBuf = vPlane.buffer

                  val yRowStride = yPlane.rowStride
                  val yPixStride = yPlane.pixelStride
                  val uRowStride = uPlane.rowStride
                  val uPixStride = uPlane.pixelStride
                  val vRowStride = vPlane.rowStride
                  val vPixStride = vPlane.pixelStride

                  for (j in 0 until height) {
                      for (i in 0 until width) {
                          val c = argb[j * width + i]
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF

                          val y = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          yBuf.put(j * yRowStride + i * yPixStride, y.coerceIn(0, 255).toByte())

                          if (j % 2 == 0 && i % 2 == 0) {
                              val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                              val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                              val uvRow = j / 2
                              val uvCol = i / 2
                              uBuf.put(uvRow * uRowStride + uvCol * uPixStride, u.coerceIn(0, 255).toByte())
                              vBuf.put(uvRow * vRowStride + uvCol * vPixStride, v.coerceIn(0, 255).toByte())
                          }
                      }
                  }
              }

              private fun bitmapToNv12(bmp: android.graphics.Bitmap, width: Int, height: Int): ByteArray {
                  val argb = IntArray(width * height)
                  bmp.getPixels(argb, 0, width, 0, 0, width, height)
                  val yuv = ByteArray(width * height * 3 / 2)
                  var yIndex = 0
                  var uvIndex = width * height
                  for (j in 0 until height) {
                      for (i in 0 until width) {
                          val c = argb[j * width + i]
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF
                          val y = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                          val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                          yuv[yIndex++] = y.coerceIn(0, 255).toByte()
                          if (j % 2 == 0 && i % 2 == 0 && uvIndex + 1 < yuv.size) {
                              yuv[uvIndex++] = u.coerceIn(0, 255).toByte()
                              yuv[uvIndex++] = v.coerceIn(0, 255).toByte()
                          }
                      }
                  }
                  return yuv
              }
          }
          EOF

      - name: Gerar e Substituir Avatar Retro 32-bit N64 Low-Poly (4 Cenas A, E, I, O)
        run: |
          pip install pillow
          python3 -c '
          import glob, os
          from PIL import Image, ImageDraw

          res_dir = "app/src/main/res/drawable"
          for name in ["reporter_closed", "reporter_open", "reporter_o", "reporter_a", "reporter_e", "reporter_i", "avatar_grid_2x2"]:
              for f in glob.glob(os.path.join(res_dir, f"{name}.*")):
                  os.remove(f)

          def render_n64_panel(phoneme):
              # Renderiza em baixa resolucao (150x150) sem anti-aliasing para autentica textura pixelada 32-bit / N64
              W, H = 150, 150
              img = Image.new("RGB", (W, H), (255, 255, 255))
              d = ImageDraw.Draw(img)

              # --- OMBROS MUSCULOSOS E CAMISA SOCIAL AZUL DE BOTAO (LOW-POLY FACETS) ---
              # Ombro esquerdo e direito (facetas poligonais azuis)
              d.polygon([(8, 150), (22, 114), (58, 106), (52, 150)], fill=(34, 88, 168))
              d.polygon([(142, 150), (128, 114), (92, 106), (98, 150)], fill=(28, 74, 145))
              # Peitoral central e camisa
              d.polygon([(52, 150), (58, 106), (92, 106), (98, 150)], fill=(42, 104, 192))
              # Sombras poligonais nas dobras da camisa
              d.polygon([(8, 150), (22, 114), (32, 125), (24, 150)], fill=(24, 64, 128))
              d.polygon([(142, 150), (128, 114), (118, 125), (126, 150)], fill=(20, 56, 114))

              # Pescoco musculoso (trapezio largo e pele bronzeada facetada)
              d.polygon([(46, 112), (56, 84), (75, 84), (75, 118)], fill=(196, 134, 92))
              d.polygon([(104, 112), (94, 84), (75, 84), (75, 118)], fill=(176, 116, 76))
              # Sombra sob o queixo
              d.polygon([(56, 88), (94, 88), (86, 100), (64, 100)], fill=(138, 86, 54))
              # Abertura V do colarinho
              d.polygon([(62, 104), (88, 104), (75, 124)], fill=(168, 110, 72))

              # Colarinho azul com pontas marcadas e botoes brancos pixelados
              d.polygon([(46, 108), (62, 102), (72, 124), (52, 120)], fill=(52, 122, 214), outline=(22, 58, 112))
              d.polygon([(104, 108), (88, 102), (78, 124), (98, 120)], fill=(38, 96, 178), outline=(22, 58, 112))
              # Vista da camisa e botoes
              d.rectangle([72, 122, 78, 150], fill=(32, 82, 156))
              d.rectangle([74, 128, 76, 130], fill=(240, 244, 250))
              d.rectangle([74, 140, 76, 142], fill=(240, 244, 250))

              # --- CABECA E ROSTO LOW-POLY (PELE BRONZEADA / TANNED SKIN) ---
              # Orelhas poligonais
              d.polygon([(36, 54), (44, 52), (44, 70), (38, 68)], fill=(184, 122, 82))
              d.polygon([(114, 54), (106, 52), (106, 70), (112, 68)], fill=(166, 108, 70))

              # Faceta central da testa
              d.polygon([(48, 34), (102, 34), (98, 50), (52, 50)], fill=(216, 152, 106))
              # Facetas laterais da testa/temporas
              d.polygon([(44, 40), (48, 34), (52, 50), (44, 54)], fill=(194, 132, 90))
              d.polygon([(106, 40), (102, 34), (98, 50), (106, 54)], fill=(182, 120, 80))

              # Facetas das bochechas (esquerda iluminada, direita sombreada N64)
              d.polygon([(44, 54), (68, 50), (66, 76), (46, 74)], fill=(210, 146, 100))
              d.polygon([(106, 54), (82, 50), (84, 76), (104, 74)], fill=(192, 128, 86))

              # Mandibula quadrada forte e queixo poligonal
              d.polygon([(46, 74), (66, 76), (64, 94), (52, 88)], fill=(188, 126, 84))
              d.polygon([(104, 74), (84, 76), (86, 94), (98, 88)], fill=(172, 112, 74))
              d.polygon([(66, 76), (84, 76), (86, 94), (75, 97), (64, 94)], fill=(202, 138, 94))

              # Nariz low-poly em 3 facetas geometricas
              d.polygon([(72, 48), (78, 48), (77, 68), (73, 68)], fill=(226, 164, 118))
              d.polygon([(67, 66), (72, 48), (73, 68)], fill=(186, 124, 82))
              d.polygon([(83, 66), (78, 48), (77, 68)], fill=(168, 108, 70))
              d.polygon([(67, 66), (83, 66), (78, 71), (72, 71)], fill=(148, 92, 58))

              # --- SOBRANCELHAS GROSSAS E OLHOS 32-BIT ---
              # Sobrancelhas castanho-escuras grossas e angulares
              d.polygon([(49, 44), (69, 46), (69, 50), (49, 48)], fill=(42, 26, 16))
              d.polygon([(101, 44), (81, 46), (81, 50), (101, 48)], fill=(42, 26, 16))

              # Olhos geométricos
              for cx in [59, 91]:
                  d.polygon([(cx-8, 53), (cx+8, 53), (cx+6, 58), (cx-6, 58)], fill=(242, 242, 242))
                  d.rectangle([cx-3, 53, cx+3, 58], fill=(56, 34, 18))
                  d.rectangle([cx-1, 54, cx+1, 57], fill=(12, 10, 10))
                  d.point((cx-2, 54), fill=(255, 255, 255))
                  d.line([(cx-8, 52), (cx+8, 52)], fill=(30, 18, 12), width=1)

              # --- CABELO CASTANHO ESCURO CURTO LOW-POLY ---
              d.polygon([(42, 44), (45, 24), (60, 15), (90, 15), (105, 24), (108, 44), (101, 34), (88, 29), (62, 29), (49, 34)], fill=(48, 30, 18))
              # Facetas superiores do cabelo (efeito poligonal N64)
              d.polygon([(45, 24), (60, 15), (75, 22), (52, 31)], fill=(62, 40, 24))
              d.polygon([(60, 15), (90, 15), (75, 22)], fill=(54, 34, 20))
              d.polygon([(90, 15), (105, 24), (98, 31), (75, 22)], fill=(38, 22, 13))

              # --- 4 EXPRESSOES DE BOCA (FONEMAS A, E, I, O) ---
              if phoneme == "A":
                  # Top-Left: Fonema A - Boca bem aberta verticalmente mostrando dentes superiores e interior escuro
                  d.polygon([(64, 74), (86, 74), (84, 90), (66, 90)], fill=(142, 78, 62))
                  d.rectangle([67, 76, 83, 88], fill=(28, 12, 14))
                  d.rectangle([68, 76, 82, 79], fill=(242, 242, 238))
              elif phoneme == "E":
                  # Top-Right: Fonema E - Boca moderadamente aberta na horizontal com cantos puxados e dentes visiveis
                  d.polygon([(61, 75), (89, 75), (86, 85), (64, 85)], fill=(142, 78, 62))
                  d.rectangle([64, 77, 86, 83], fill=(32, 14, 16))
                  d.rectangle([65, 77, 85, 79], fill=(242, 242, 238))
                  d.rectangle([67, 82, 83, 83], fill=(225, 225, 220))
              elif phoneme == "I":
                  # Bottom-Left: Fonema I - Labios esticados largos com dentes cerrados visiveis
                  d.polygon([(60, 76), (90, 76), (88, 83), (62, 83)], fill=(142, 78, 62))
                  d.rectangle([63, 78, 87, 81], fill=(240, 240, 236))
                  d.line([(63, 79), (87, 79)], fill=(90, 80, 75), width=1)
              elif phoneme == "O":
                  # Bottom-Right: Fonema O - Labios arredondados em pequena abertura circular
                  d.polygon([(68, 74), (82, 74), (85, 81), (82, 88), (68, 88), (65, 81)], fill=(142, 78, 62))
                  d.polygon([(71, 77), (79, 77), (81, 81), (79, 85), (71, 85), (69, 81)], fill=(26, 10, 12))

              # Escala para 600x600 usando NEAREST para preservar os pixels nitidos de 32-bit sem anti-aliasing
              return img.resize((600, 600), Image.Resampling.NEAREST)

          img_a = render_n64_panel("A")
          img_e = render_n64_panel("E")
          img_i = render_n64_panel("I")
          img_o = render_n64_panel("O")

          # Salvar cada um dos 4 fonemas individualmente
          img_a.save(os.path.join(res_dir, "reporter_a.png"), "PNG")
          img_e.save(os.path.join(res_dir, "reporter_e.png"), "PNG")
          img_i.save(os.path.join(res_dir, "reporter_i.png"), "PNG")
          img_o.save(os.path.join(res_dir, "reporter_o.png"), "PNG")

          # Mapear para os 3 drawables utilizados pelo motor de video do app
          img_i.save(os.path.join(res_dir, "reporter_closed.png"), "PNG")
          img_e.save(os.path.join(res_dir, "reporter_open.png"), "PNG")

          # Salvar tambem o grid 2x2 completo com linhas pretas finas separando os 4 quadrantes
          grid = Image.new("RGB", (1204, 1204), (0, 0, 0))
          grid.paste(img_a, (0, 0))
          grid.paste(img_e, (604, 0))
          grid.paste(img_i, (0, 604))
          grid.paste(img_o, (604, 604))
          grid.save(os.path.join(res_dir, "avatar_grid_2x2.png"), "PNG")
          '

