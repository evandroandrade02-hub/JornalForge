name: Gerar APK JornalForge

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./JornalForge_Android

    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ativar AndroidX e Ajustar Manifesto e Codigo
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          sed -i 's/FOREGROUND_SERVICE_MEDIA_PROCESSING/FOREGROUND_SERVICE_DATA_SYNC/g' app/src/main/AndroidManifest.xml
          sed -i 's/mediaProcessing/dataSync/g' app/src/main/AndroidManifest.xml
          sed -i '/ffmpeg-kit/d' app/build.gradle.kts
          sed -i '/com.arthenica.ffmpegkit/d' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/FFmpegKit.cancel()/\/\/ cancel/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/val concatSession = FFmpegKit.execute.*/fullAudioWav.writeBytes(sceneAudioList.first().wavFile.readBytes())/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/if (!ReturnCode.isSuccess(concatSession.returnCode) || !fullAudioWav.exists())/if (!fullAudioWav.exists())/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/val encodeSession = FFmpegKit.execute.*/com.jornalforge.app.video.SimpleMp4Muxer.mux(framesDir, fullAudioWav, finalTempMp4, aspect.width, aspect.height)/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/if (!ReturnCode.isSuccess(encodeSession.returnCode) || !finalTempMp4.exists() || !finalTempMp4.exists() || finalTempMp4.length() == 0L)/if (!finalTempMp4.exists() || finalTempMp4.length() == 0L)/g' app/src/main/java/com/jornalforge/app/service/VideoExportService.kt
          sed -i 's/if (!ReturnCode.isSuccess(encodeSession.returnCode) || !finalTempMp4.exists() || finalTempMp4.length() == 0L)/if (!finalTempMp4.exists() || finalTempMp4.length() == 0L)/g' app/src/main/java/com/jornalforge/app/
